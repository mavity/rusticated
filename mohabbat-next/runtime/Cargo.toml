[package]
name = "mohabbat-next-runtime"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"
doctest = false

[dependencies]
wasmtime = { version = "=50.0.1", default-features = false, features = [
    "runtime",
    "cranelift",
    "custom-virtual-memory",
] }
log = { version = "0.4", default-features = false, features = ["release_max_level_off"] }

[features]
default = ["x86_64", "aarch64"]
x86_64 = []
aarch64 = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
