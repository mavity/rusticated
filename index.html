    <!-- 
      Pull in README.md dynamically.
      This works over file:// purely because README.md is polyglot Javascript and Markdown 
    -->
    <script src="README.md"></script>

    <script>
        const encoder = new TextEncoder();
        const decoder = new TextDecoder();
        const termDecoder = new TextDecoder();

        // --- IndexedDB Mock Filesystem (Synchronous in-memory with background persistence) ---
        class IndexedDBFS {
            constructor(dbName = 'RusticatedFS') {
                this.dbName = dbName;
                this.db = null;
                this.entries = new Map();
            }

            async init() {
                this.db = await new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('files')) {
                            db.createObjectStore('files', { keyPath: 'path' });
                        }
                    };
                    request.onsuccess = (e) => resolve(e.target.result);
                    request.onerror = (e) => reject(e.target.error);
                });

                // Load all entries into memory
                const allEntries = await new Promise((resolve, reject) => {
                    const tx = this.db.transaction('files', 'readonly');
                    const store = tx.objectStore('files');
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.target.error);
                });

                for (const e of allEntries) {
                    this.entries.set(e.path, e);
                }
            }

            seed() {
                const now = Date.now();
                const initialFiles = [
                    { path: '/', type: 'dir', mtime: now },
                    { path: '/bin', type: 'dir', mtime: now },
                    { path: '/etc', type: 'dir', mtime: now },
                    { path: '/etc/hosts', type: 'file', content: encoder.encode('127.0.0.1 localhost\n'), mtime: now },
                    { path: '/etc/hostname', type: 'file', content: encoder.encode('rusticated-wasm\n'), mtime: now },
                    { path: '/etc/passwd', type: 'file', content: encoder.encode('root:x:0:0:root:/root:/bin/sh\nuser:x:1000:1000:user:/home/user:/bin/sh\n'), mtime: now },
                    { path: '/etc/group', type: 'file', content: encoder.encode('root:x:0:\nuser:x:1000:\n'), mtime: now },
                    { path: '/etc/motd', type: 'file', content: encoder.encode('Welcome to the Rusticated WASM environment!\nToday is a good day for hacking.\nType \'ls\' to see files and \'cat /etc/motd\' to read them.\n'), mtime: now },
                    { path: '/home', type: 'dir', mtime: now },
                    { path: '/home/user', type: 'dir', mtime: now },
                    { path: '/home/user/.bashrc', type: 'file', content: encoder.encode('alias ls="ls --color=auto"\nalias ll="ls -la"\n'), mtime: now },
                    { path: '/home/user/test.txt', type: 'file', content: encoder.encode('This is a test file in IndexedDB.\nIt persists across reloads!\n'), mtime: now },
                    { path: '/usr', type: 'dir', mtime: now },
                    { path: '/usr/bin', type: 'dir', mtime: now },
                    { path: '/usr/lib', type: 'dir', mtime: now },
                    { path: '/usr/local', type: 'dir', mtime: now },
                    { path: '/var', type: 'dir', mtime: now },
                    { path: '/var/log', type: 'dir', mtime: now },
                    { path: '/var/tmp', type: 'dir', mtime: now },
                    { path: '/tmp', type: 'dir', mtime: now },
                    { path: '/dev', type: 'dir', mtime: now },
                    { path: '/README.md', type: 'file', content: encoder.encode('# Rusticated WASM Shell\n\nWelcome to kabibi running in the browser.\nThis environment features a virtualized file system backed by IndexedDB.\n\nEnjoy your stay!\n'), mtime: now }
                ];

                for (const f of initialFiles) {
                    if (f.content) f.size = f.content.length;
                    else f.size = 0;
                    if (!this.entries.has(f.path)) {
                        console.log(`Seeding: ${f.path}`);
                        this.entries.set(f.path, f);
                        this.persistEntry(f);
                    }
                }
            }

            getEntrySync(path) {
                // Normalize path
                if (path === "." || path === "" || path === "./") path = "/";
                if (!path.startsWith("/")) path = "/" + path;
                path = path.replace(/\/+/g, '/');
                if (path.length > 1 && path.endsWith('/')) {
                    path = path.substring(0, path.length - 1);
                }
                return this.entries.get(path);
            }

            putEntrySync(entry) {
                entry.mtime = Date.now();
                this.entries.set(entry.path, entry);
                this.persistEntry(entry);
            }

            persistEntry(entry) {
                const tx = this.db.transaction('files', 'readwrite');
                const store = tx.objectStore('files');
                store.put(entry);
            }

            readdirSync(dirPath) {
                if (dirPath.length > 1 && dirPath.endsWith('/')) {
                    dirPath = dirPath.substring(0, dirPath.length - 1);
                }
                const prefix = dirPath === '/' ? '/' : dirPath + '/';
                const results = [];

                for (const [path, entry] of this.entries.entries()) {
                    if (path === dirPath) continue;
                    if (path.startsWith(prefix)) {
                        const relative = path.substring(prefix.length);
                        if (relative.length > 0 && !relative.includes('/')) {
                            results.push(entry);
                        }
                    }
                }
                
                return results.sort((a, b) => {
                    const na = a.path.split('/').pop() || '';
                    const nb = b.path.split('/').pop() || '';
                    return na.localeCompare(nb);
                });
            }
        }

        // --- WASM Host Implementation ---
        async function initTerminalAndWasm() {
            console.log("initTerminalAndWasm START");
            const term = new Terminal({
                cursorBlink: true,
                allowProposedApi: true,
                fontFamily: 'Consolas, "Cascadia Mono", "Fira Code", Menlo, monospace'
            });
            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            window.term = term;

            term.open(document.getElementById('terminal-container'));
            fitAddon.fit();
            window.addEventListener('resize', () => {
                fitAddon.fit();
                if (window.hostState && window.hostState.triggerSignal) {
                    window.hostState.triggerSignal(28); // SIGWINCH
                }
            });

            term.write('Connecting to kabibi WASM...\r\n');

            // Refactored host state
            const fs = new IndexedDBFS();
            await fs.init();
            await fs.seed();

            const hostState = {
                memory: null,
                cwd: "/home/user",
                stdinBuffer: [],
                pendingReads: [],
                pendingSignals: [],
                pendingSignalCounts: new Map(),
                handles: new Map([
                    [0n, { type: 'stdin' }],
                    [1n, { type: 'stdout' }],
                    [2n, { type: 'stderr' }]
                ]),
                nextHandle: 3n,

                safeWriteOverlapped: function(ovPtr, errorCode, continued, resultExt) {
                    if (!this.memory || !this.memory.buffer) return;
                    ovPtr = Number(ovPtr);
                    const buf = this.memory.buffer;
                    if (!Number.isFinite(ovPtr) || ovPtr < 0 || ovPtr + 24 > buf.byteLength) {
                        return;
                    }
                    const view = new DataView(buf);
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, Number(errorCode) || 0, true);
                    view.setBigUint64(ovPtr + 8, BigInt(continued || 0n), true);
                    view.setBigUint64(ovPtr + 16, BigInt(resultExt || 0n), true);
                },
                
                write: function(ovPtr, handle, ptr, len) {
                    const view = new DataView(this.memory.buffer);
                    ptr = Number(ptr);
                    len = Number(len);
                    ovPtr = Number(ovPtr);
                    handle = BigInt(handle);
                    
                    const h = this.handles.get(handle);
                    if (h && (h.type === 'stdout' || h.type === 'stderr' || h.type === 'tty')) {
                        if (len > 0) {
                            const bytes = new Uint8Array(this.memory.buffer, ptr, len).slice();
                            if (bytes.length > 0) {
                                term.write(bytes);
                            }
                        }
                    } else if (h && h.type === 'file') {
                        const buf = new Uint8Array(this.memory.buffer, ptr, len);
                        const newContent = new Uint8Array(h.entry.content.length + len);
                        newContent.set(h.entry.content);
                        newContent.set(buf, h.entry.content.length);
                        h.entry.content = newContent;
                        fs.putEntrySync(h.entry);
                    }
                    
                    // Write overlapped result
                    view.setUint32(ovPtr, 1, true); // done
                    view.setUint32(ovPtr + 4, 0, true); // errorCode = 0
                    view.setBigUint64(ovPtr + 8, 0n, true); // continued
                    view.setBigUint64(ovPtr + 16, BigInt(len), true); // resultExt = nwritten
                    return 0;
                },
                read: function(ovPtr, handle, ptr, len) {
                    ovPtr = Number(ovPtr);
                    ptr = Number(ptr);
                    len = Number(len);
                    handle = BigInt(handle);
                    
                    const h = this.handles.get(handle);
                    if (h && (h.type === 'stdin' || h.type === 'tty')) {
                        if (this.stdinBuffer.length > 0) {
                            const toRead = Math.min(len, this.stdinBuffer.length);
                            const data = this.stdinBuffer.splice(0, toRead);
                            const buf = new Uint8Array(this.memory.buffer, ptr, toRead);
                            buf.set(data);

                            const view = new DataView(this.memory.buffer);
                            view.setUint32(ovPtr, 1, true); // done
                            view.setUint32(ovPtr + 4, 0, true); // errorCode = 0
                            view.setBigUint64(ovPtr + 8, 0n, true); // continued
                            view.setBigUint64(ovPtr + 16, BigInt(toRead), true); // resultExt = nread
                            return 0;
                        }
                        this.pendingReads.push({ ovPtr, ptr, len });
                        return 0;
                    } else if (h && h.type === 'file') {
                        const available = h.entry.content.length - h.offset;
                        const toRead = Math.min(len, available);
                        if (toRead > 0) {
                            const buf = new Uint8Array(this.memory.buffer, ptr, toRead);
                            buf.set(h.entry.content.subarray(h.offset, h.offset + toRead));
                            h.offset += toRead;
                        }
                        const view = new DataView(this.memory.buffer);
                        view.setUint32(ovPtr, 1, true); // done
                        view.setUint32(ovPtr + 4, 0, true); // errorCode = 0
                        view.setBigUint64(ovPtr + 8, 0n, true); // continued
                        view.setBigUint64(ovPtr + 16, BigInt(toRead), true); // resultExt = nread
                        return 0;
                    }
                    return 0;
                },
                pushStdin: function(data) {
                    if (typeof data === 'string') {
                        const encoded = encoder.encode(data);
                        this.stdinBuffer.push(...encoded);
                        console.log(`pushStdin: string "${data}" (${encoded.length} bytes), pendingReads=${this.pendingReads.length}`);
                    } else {
                        this.stdinBuffer.push(...data);
                        console.log(`pushStdin: ${data.length} bytes, pendingReads=${this.pendingReads.length}`);
                    }
                    this.processPendingReads();
                },
                processPendingReads: function() {
                    if (!this.memory) return;
                    const view = new DataView(this.memory.buffer);
                    let completedCount = 0;
                    while (this.pendingReads.length > 0 && this.stdinBuffer.length > 0) {
                        const { ovPtr, ptr, len } = this.pendingReads.shift();
                        const toRead = Math.min(len, this.stdinBuffer.length);
                        const data = this.stdinBuffer.splice(0, toRead);
                        const buf = new Uint8Array(this.memory.buffer, ptr, toRead);
                        buf.set(data);

                        view.setUint32(ovPtr, 1, true); // done
                        view.setUint32(ovPtr + 4, 0, true); // errorCode = 0
                        view.setBigUint64(ovPtr + 8, 0n, true); // continued
                        view.setBigUint64(ovPtr + 16, BigInt(toRead), true); // resultExt = nread
                        completedCount++;
                    }
                    if (completedCount > 0) {
                        console.log(`processPendingReads: completed ${completedCount} reads`);
                    }
                },
                triggerSignal: function(signum) {
                    if (!this.memory) return;
                    const remaining = [];
                    let completed = 0;
                    for (const s of this.pendingSignals) {
                        if (s.signum === signum || s.signum === 0) {
                            this.safeWriteOverlapped(s.ovPtr, 0, 0n, BigInt(signum));
                            completed++;
                        } else {
                            remaining.push(s);
                        }
                    }
                    if (completed > 0) {
                        console.log(`triggerSignal(${signum}): completed ${completed} waits`);
                    } else {
                        const current = this.pendingSignalCounts.get(signum) || 0;
                        this.pendingSignalCounts.set(signum, current + 1);
                    }
                    this.pendingSignals = remaining;
                    return completed;
                },
                completeSignalWait: function(ovPtr, signum) {
                    this.safeWriteOverlapped(ovPtr, 0, 0n, BigInt(signum));
                }
            };
            window.hostState = hostState;

            const resolvePath = (inputPath) => {
                const raw = String(inputPath || '').replace(/\0.*/, '');
                let path = raw;
                if (!path) {
                    path = hostState.cwd;
                } else if (!path.startsWith('/')) {
                    path = hostState.cwd === '/' ? `/${path}` : `${hostState.cwd}/${path}`;
                }
                path = path.replace(/\/+/g, '/');
                const parts = [];
                for (const seg of path.split('/')) {
                    if (!seg || seg === '.') continue;
                    if (seg === '..') {
                        if (parts.length > 0) parts.pop();
                        continue;
                    }
                    parts.push(seg);
                }
                return '/' + parts.join('/');
            };

            const parentDir = (path) => {
                if (!path || path === '/') return '/';
                const idx = path.lastIndexOf('/');
                if (idx <= 0) return '/';
                return path.slice(0, idx);
            };

            term.onData(data => hostState.pushStdin(data));

            // Define the "env" module expected by rusticated/washmhost guest binaries
            const env = {
                get_args: (ptr, len) => {
                    const args = ["kabibi"];
                    let totalLen = 0;
                    const encoded = args.map(a => {
                        const e = encoder.encode(a + "\0");
                        totalLen += e.length;
                        return e;
                    });
                    
                    if (ptr !== 0 && len >= totalLen) {
                        let offset = Number(ptr);
                        for (const e of encoded) {
                            const buf = new Uint8Array(hostState.memory.buffer, offset, e.length);
                            buf.set(e);
                            offset += e.length;
                        }
                    }
                    return (BigInt(args.length) << 32n) | BigInt(totalLen);
                },
                get_env: (ptr, len) => {
                    const envVars = [
                        "TERM=xterm-256color",
                        "COLORTERM=truecolor",
                        "PATH=/bin",
                        "HOME=/home/user",
                        "HTTPS_PROXY=http://127.0.0.1:8888",
                        "HTTP_PROXY=http://127.0.0.1:8888"
                    ];
                    let totalLen = 0;
                    const encoded = envVars.map(v => {
                        const e = encoder.encode(v + "\0");
                        totalLen += e.length;
                        return e;
                    });
                    
                    if (ptr !== 0 && len >= totalLen) {
                        let offset = Number(ptr);
                        for (const e of encoded) {
                            const buf = new Uint8Array(hostState.memory.buffer, offset, e.length);
                            buf.set(e);
                            offset += e.length;
                        }
                    }
                    return (BigInt(envVars.length) << 32n) | BigInt(totalLen);
                },
                get_cwd: (buf_ptr, buf_len) => {
                    const cwd = hostState.cwd;
                    const enc = encoder.encode(cwd + "\0");
                    if (buf_ptr !== 0) {
                        const buf = new Uint8Array(hostState.memory.buffer, buf_ptr, Math.min(enc.length, buf_len));
                        buf.set(enc.slice(0, Math.min(enc.length, buf_len)));
                    }
                    return BigInt(enc.length);
                },
                set_cwd: (ptr, len) => {
                    const pathBytes = new Uint8Array(hostState.memory.buffer, Number(ptr), Number(len));
                    const normalized = resolvePath(decoder.decode(pathBytes));
                    const entry = fs.getEntrySync(normalized);
                    if (entry && entry.type === 'dir') {
                        hostState.cwd = normalized;
                        return 0;
                    }
                    return 2; // ENOENT
                },
                get_random: (ptr, len) => {
                    const buf = new Uint8Array(hostState.memory.buffer, Number(ptr), Number(len));
                    crypto.getRandomValues(buf);
                },
                get_time: () => BigInt(Date.now()) * 1000000n,
                host_panic: (ptr, len) => {
                    const buf = new Uint8Array(hostState.memory.buffer, Number(ptr), Number(len));
                    const msg = decoder.decode(buf);
                    console.error("HOST PANIC:", msg);
                    term.write(`\r\n\x1b[31mHOST PANIC: ${msg}\x1b[0m\r\n`);
                    throw new Error("WASM Panicked");
                },
                timer_set: (ovPtr, delayMs) => {
                    ovPtr = Number(ovPtr);
                    setTimeout(() => {
                        hostState.safeWriteOverlapped(ovPtr, 0, 0n, 0n);
                    }, Number(delayMs));
                },
                read: (ovPtr, handle, ptr, len) => hostState.read(ovPtr, handle, ptr, len),
                seek: (ovPtr, handle, offset, whence) => {
                    ovPtr = Number(ovPtr);
                    offset = Number(offset);
                    whence = Number(whence);
                    const view = new DataView(hostState.memory.buffer);
                    const h = hostState.handles.get(BigInt(handle));

                    if (!h) {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 9, true); // EBADF
                        return 0;
                    }

                    let base = 0;
                    if (h.type === 'file' && h.entry && typeof h.entry.content !== 'undefined') {
                        base = h.entry.content.length;
                    }

                    let nextPos = 0;
                    switch (whence) {
                        case 0: // SEEK_SET
                            nextPos = offset;
                            break;
                        case 1: // SEEK_CUR
                            nextPos = (Number(h.offset || 0)) + offset;
                            break;
                        case 2: // SEEK_END
                            nextPos = base + offset;
                            break;
                        default:
                            view.setUint32(ovPtr, 1, true);
                            view.setUint32(ovPtr + 4, 22, true); // EINVAL
                            return 0;
                    }

                    if (nextPos < 0) {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 22, true); // EINVAL
                        return 0;
                    }

                    h.offset = nextPos;
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    view.setBigUint64(ovPtr + 8, 0n, true);
                    view.setBigUint64(ovPtr + 16, BigInt(nextPos), true);
                    return 0;
                },
                write: (ovPtr, handle, ptr, len) => hostState.write(ovPtr, handle, ptr, len),
                handle_close: (handle) => {
                    hostState.handles.delete(BigInt(handle));
                },
                path_open: (ovPtr, pathPtr, pathLen, flags) => {
                    const rawPath = decoder.decode(new Uint8Array(hostState.memory.buffer, Number(pathPtr), Number(pathLen))).replace(/\0.*/, '');
                    let path = resolvePath(rawPath);
                    console.log("PATH_OPEN:", path, flags);
                    
                    // Trigger lazy bootstrap on first cache directory access
                    if (path.includes('.cache/kabibi') && !browserAssetState.bootstrapComplete && !browserAssetState.bootstrapStarted) {
                        console.log('[Bootstrap] Triggered by path_open access to cache directory');
                        bootstrapBrowserAssets(fs).catch(err => {
                            console.error('[Bootstrap] Failed during lazy trigger:', err);
                        });
                    }
                    
                    ovPtr = Number(ovPtr);
                    const view = new DataView(hostState.memory.buffer);
                    const oflags = Number(flags);

                    // Two flag families are used by guests:
                    // 1) rusticated-rust wasm fs::OpenOptions: read=1, write=2, create=4, trunc=8, append=16, create_new=32
                    // 2) rusticated-go/wasip1 style: access mode in low 2 bits, create=0x40, excl=0x80, trunc=0x200, append=0x400
                    const hasHighPosixBits = (oflags & (0x40 | 0x80 | 0x200 | 0x400)) !== 0;
                    const hasOnlyRusticatedBits = (oflags & ~0x1003f) === 0;
                    const useRusticatedFlags = !hasHighPosixBits && hasOnlyRusticatedBits;

                    let readFlag = false;
                    let writeFlag = false;
                    let createFlag = false;
                    let createNewFlag = false;
                    let truncateFlag = false;
                    let appendFlag = false;

                    if (useRusticatedFlags) {

                        createNewFlag = (oflags & 0x80) !== 0;
                        truncateFlag = (oflags & 0x200) !== 0;
                        appendFlag = (oflags & 0x400) !== 0;

                    const wantDirectory = (oflags & 0x10000) !== 0;

                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 0, true);
                        view.setBigUint64(ovPtr + 16, handle, true);
                        return 0;
                    }

                            const p = fs.getEntrySync(parent);
                            if (!p || p.type !== 'dir') {

                                view.setUint32(ovPtr + 4, 44, true); // ENOENT

                            const out = new Uint8Array(hostState.memory.buffer, currentOffset, toCopy);

                            bytesWritten += entryBytes.length;
                            remaining -= entryBytes.length;

            // === IndexedDB Model Persistence (Phase 2) ===
            class IndexedDBModelStore {
                constructor(dbName = 'KabiBiModelCache') {
                    this.dbName = dbName;
                    this.db = null;
                }

                async init() {
                    return new Promise((resolve, reject) => {
                        const request = indexedDB.open(this.dbName, 2);
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains('models')) {
                                const store = db.createObjectStore('models', { keyPath: 'url' });
                                store.createIndex('timestamp', 'timestamp', { unique: false });
                            }
                        };
                        request.onsuccess = (e) => {
                            this.db = e.target.result;
                            resolve();
                        };
                        request.onerror = (e) => reject(e.target.error);
                    });
                }

                async saveModel(url, bytes, metadata = {}) {
                    if (!this.db) await this.init();
                    const hash = await this.computeHash(bytes);
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction('models', 'readwrite');
                        const store = tx.objectStore('models');
                        const record = {
                            url,
                            bytes,
                            timestamp: Date.now(),
                            size: bytes.length,
                            hash,
                            ...metadata
                        };
                        const req = store.put(record);
                        req.onsuccess = () => {
                            console.log('[ModelStore] Saved model:', url, '(' + (bytes.length / 1024 / 1024).toFixed(1) + ' MB)');
                            resolve(record);
                        };
                        req.onerror = () => reject(req.error);
                    });
                }

                async loadModel(url) {
                    if (!this.db) await this.init();
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction('models', 'readonly');
                        const store = tx.objectStore('models');
                        const req = store.get(url);
                        req.onsuccess = () => {
                            if (req.result) {
                                console.log('[ModelStore] Loaded model from cache:', url);
                                resolve(req.result);
                            } else {
                                resolve(null);
                            }
                        };
                        req.onerror = () => reject(req.error);
                    });
                }

                async isModelCached(url) {
                    const model = await this.loadModel(url);
                    return model !== null;
                }

                async clearCache() {
                    if (!this.db) await this.init();
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction('models', 'readwrite');
                        const store = tx.objectStore('models');
                        const req = store.clear();
                        req.onsuccess = () => {
                            console.log('[ModelStore] Cache cleared');
                            resolve();
                        };
                        req.onerror = () => reject(req.error);
                    });
                }

                async computeHash(bytes) {
                    const hashBuffer = await crypto.subtle.digest('SHA-256', bytes);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                }
            }

            // === Robust Network Fetcher (Phase 2) ===
            class RobustHTTPFetcher {
                constructor(maxRetries = 3) {
                    this.maxRetries = maxRetries;
                }

                async fetchWithRetry(url, options = {}) {
                    let lastError;
                    for (let attempt = 1; attempt <= this.maxRetries; attempt++) {
                        try {
                            console.log('[Fetcher] Attempt ' + attempt + '/' + this.maxRetries + ' for:', url);
                            const response = await fetch(url, options);
                            if (!response.ok) {
                                throw new Error('HTTP ' + response.status);
                            }
                            console.log('[Fetcher] Succeeded on attempt', attempt);
                            return response;
                        } catch (err) {
                            lastError = err;
                            if (attempt < this.maxRetries) {
                                const delay = Math.pow(2, attempt - 1) * 1000; // exponential backoff
                                console.log('[Fetcher] Error:', err.message, '- Retrying in', delay, 'ms');
                                await new Promise(r => setTimeout(r, delay));
                            }
                        }
                    }
                    throw new Error('Fetch failed after ' + this.maxRetries + ' attempts: ' + lastError.message);
                }

                async fetchWithProgress(url, onProgress) {
                    const response = await this.fetchWithRetry(url);
                    const contentLength = Number(response.headers.get('content-length') || 0);
                    const reader = response.body.getReader();
                    const chunks = [];
                    let received = 0;

                    while (true) {
                        const {done, value} = await reader.read();
                        if (done) break;

                        chunks.push(value);
                        received += value.length;

                        if (onProgress && contentLength > 0) {
                            onProgress({
                                received,
                                total: contentLength,
                                percent: Math.round((received / contentLength) * 100)
                            });
                        }
                    }

                    return new Uint8Array(chunks.reduce((a, b) => a.concat(Array.from(b)), []));
                }
            }

            // === LiteRT Engine Manager (Phase 2) ===
            class LiteRTEngineManager {
                constructor() {
                    this.engine = null;
                    this.isInitialized = false;
                    this.isInitializing = false;
                    this.modelBytes = null;
                    console.log('[EngineManager] Created');
                }

                async initialize(modelBytes) {
                    if (this.isInitialized) {
                        console.log('[EngineManager] Already initialized');
                        return this.engine;
                    }

                    if (this.isInitializing) {
                        console.log('[EngineManager] Initialization in progress, waiting...');
                        let attempts = 0;
                        while (!this.isInitialized && attempts < 100) {
                            await new Promise(r => setTimeout(r, 100));
                            attempts++;
                        }
                        return this.engine;
                    }

                    this.isInitializing = true;
                    this.modelBytes = modelBytes;

                    try {
                        console.log('[EngineManager] Importing Engine from CDN...');
                        const { Engine } = await import('https://cdn.jsdelivr.net/npm/@litert-lm/core@0.1.0/+esm');
                        console.log('[EngineManager] Engine imported, creating instance...');

                        // Create a blob URL for the model to allow Engine to access it
                        const modelBlob = new Blob([modelBytes]);
                        const modelUrl = URL.createObjectURL(modelBlob);

                        this.engine = await Engine.create({
                            modelUrl: modelUrl,
                            streaming: true
                        });

                        console.log('[EngineManager] Engine initialized successfully');
                        this.isInitialized = true;
                        return this.engine;
                    } catch (err) {
                        console.error('[EngineManager] Initialization failed:', err);
                        this.isInitializing = false;
                        throw err;
                    }
                }

                async createConversation() {
                    if (!this.isInitialized) {
                        throw new Error('Engine not initialized');
                    }
                    console.log('[EngineManager] Creating conversation');
                    return await this.engine.createConversation();
                }

                async streamMessage(conversation, userMessage, onToken, onComplete) {
                    if (!this.isInitialized) {
                        throw new Error('Engine not initialized');
                    }

                    try {
                        console.log('[EngineManager] Streaming message:', userMessage.substring(0, 50) + '...');
                        let fullResponse = '';
                        let tokenCount = 0;

                        for await (const token of conversation.sendMessageStreaming(userMessage)) {
                            fullResponse += token;
                            tokenCount++;
                            if (onToken) onToken(token);
                        }

                        console.log('[EngineManager] Stream complete:', tokenCount, 'tokens');
                        if (onComplete) onComplete(fullResponse);
                        return fullResponse;
                    } catch (err) {
                        console.error('[EngineManager] Streaming failed:', err);
                        throw err;
                    }
                }

                cleanup() {
                    if (this.engine && this.engine.dispose) {
                        console.log('[EngineManager] Disposing engine');
                        this.engine.dispose();
                    }
                    this.engine = null;
                    this.isInitialized = false;
                }
            }

            // === Callback Streamer (Phase 2) ===
            class CallbackStreamer {
                constructor() {
                    this.pendingCallbacks = new Map();
                    this.callbackCounter = 0n;
                }

                createCallback(onToken, onComplete) {
                    const id = ++this.callbackCounter;
                    this.pendingCallbacks.set(id, { onToken, onComplete, tokens: [] });
                    return id;
                }

                streamToken(id, token) {
                    const callback = this.pendingCallbacks.get(id);
                    if (callback) {
                        callback.tokens.push(token);
                        if (callback.onToken) callback.onToken(token);
                    }
                }

                completeCallback(id, fullResponse) {
                    const callback = this.pendingCallbacks.get(id);
                    if (callback) {
                        if (callback.onComplete) callback.onComplete(fullResponse);
                        this.pendingCallbacks.delete(id);
                    }
                }

                getTokens(id) {
                    const callback = this.pendingCallbacks.get(id);
                    return callback ? callback.tokens.slice() : [];
                }
            }

            class AdvancedTokenStreamer {
                constructor() {
                    this.callbacks = new Map();
                    this.eventTarget = new EventTarget();
                    console.log('[AdvancedTokenStreamer] Initialized');
                }
                createCallback(onToken, onComplete, onError) {
                    const id = crypto.randomUUID();
                    this.callbacks.set(id, {
                        onToken: onToken || function() {},
                        onComplete: onComplete || function() {},
                        onError: onError || function() {},
                        cancelled: false,
                        tokens: [],
                        startTime: Date.now()
                    });
                    return id;
                }
                streamToken(callbackId, token) {
                    const callback = this.callbacks.get(callbackId);
                    if (!callback || callback.cancelled) return;
                    callback.tokens.push(token);
                    try { callback.onToken(token); } catch (e) { console.error(e); }
                    this.eventTarget.dispatchEvent(new CustomEvent('token', {
                        detail: { callbackId: callbackId, token: token, count: callback.tokens.length }
                    }));
                }
                completeCallback(callbackId, fullResponse) {
                    const callback = this.callbacks.get(callbackId);
                    if (!callback || callback.cancelled) return;
                    const duration = Date.now() - callback.startTime;
                    const tokensPerSec = (callback.tokens.length / duration * 1000).toFixed(2);
                    try {
                        callback.onComplete({
                            response: fullResponse, tokenCount: callback.tokens.length, duration: duration, tokensPerSec: tokensPerSec
                        });
                    } catch (e) { console.error(e); }
                    this.eventTarget.dispatchEvent(new CustomEvent('complete', {
                        detail: { callbackId: callbackId, response: fullResponse, stats: { tokenCount: callback.tokens.length, tokensPerSec: tokensPerSec, duration: duration } }
                    }));
                    console.log('[AdvancedTokenStreamer] Complete: ' + callback.tokens.length + ' tokens');
                }
                errorCallback(callbackId, error) {
                    const callback = this.callbacks.get(callbackId);
                    if (!callback) return;
                    try { callback.onError(error); } catch (e) { console.error(e); }
                    this.eventTarget.dispatchEvent(new CustomEvent('error', {
                        detail: { callbackId: callbackId, error: error }
                    }));
                }
                cancelCallback(callbackId) {
                    const callback = this.callbacks.get(callbackId);
                    if (callback) { callback.cancelled = true; }
                }
                getTokens(callbackId) {
                    const callback = this.callbacks.get(callbackId);
                    return callback ? callback.tokens : [];
                }
                addEventListener(event, handler) { this.eventTarget.addEventListener(event, handler); }
                removeEventListener(event, handler) { this.eventTarget.removeEventListener(event, handler); }
                cleanup(callbackId) { this.callbacks.delete(callbackId); }
            }

            class BatchInferenceProcessor {
                constructor(engineManager, maxConcurrent) {
                    this.engineManager = engineManager;
                    this.maxConcurrent = maxConcurrent || 2;
                    this.queue = [];
                    this.active = 0;
                    this.results = [];
                    console.log('[BatchInferenceProcessor] Init');
                }
                async processBatch(messages) {
                    console.log('[BatchInferenceProcessor] Starting: ' + messages.length + ' msgs');
                    this.queue = messages.slice();
                    this.active = 0;
                    this.results = [];
                    return new Promise((resolve) => {
                        const checkQueue = setInterval(() => {
                            while (this.active < this.maxConcurrent && this.queue.length > 0) {
                                const msg = this.queue.shift();
                                this.active++;
                                this.processMessage(msg).catch(e => {
                                    console.error(e);
                                    this.results.push({ error: e.message });
                                }).finally(() => { this.active--; });
                            }
                            if (this.queue.length === 0 && this.active === 0) {
                                clearInterval(checkQueue);
                                resolve(this.results);
                            }
                        }, 100);
                    });
                }
                async processMessage(msg) {
                    return new Promise((resolve) => {
                        const conv = { id: crypto.randomUUID() };
                        this.engineManager.streamMessage(conv, msg.text,
                            (token) => { if (msg.onToken) msg.onToken(token); },
                            (fullResponse) => {
                                this.results.push({
                                    id: msg.id, text: msg.text, response: fullResponse, timestamp: Date.now()
                                });
                                resolve({ id: msg.id, success: true });
                            }
                        );
                    });
                }
            }

                                        await libH.engine.initialize(modelBytes);
                                    }
                                    console.log('[dylib_call] Engine initialized successfully');
                                    break;
                                    
                                case 'conversationCreate':

                                    if (libH.conversation) {

                                            (response) => callbackStreamer.completeCallback(callbackId, response)

                        dstBuf.set(srcBuf.slice(0, toCopy));
                        
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 0, true);
                        view.setBigUint64(ovPtr + 16, BigInt(toCopy), true);
                    } else {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 22, true); // EINVAL
                    }
                    return 0;
                },
                dylib_write_mem: (ovPtr, libHandle, hostPtr, guestBufPtr, length) => {
                    // Write memory to dylib allocated region
                    ovPtr = Number(ovPtr);
                    hostPtr = BigInt(hostPtr);
                    guestBufPtr = Number(guestBufPtr);
                    length = Number(length);
                    
                    const view = new DataView(hostState.memory.buffer);
                    
                    if (hostState.dylibMem && hostState.dylibMem.has(hostPtr)) {
                        const srcBuf = new Uint8Array(hostState.memory.buffer, guestBufPtr, length);
                        const dstBuf = hostState.dylibMem.get(hostPtr);
                        const toCopy = Math.min(srcBuf.length, dstBuf.length);
                        dstBuf.set(srcBuf.slice(0, toCopy));
                        
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 0, true);
                        view.setBigUint64(ovPtr + 16, BigInt(toCopy), true);
                    } else {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 22, true); // EINVAL
                    }
                    return 0;
                },
                dylib_alloc: (ovPtr, libHandle, size, align) => {
                    // Allocate memory for dylib calls
                    // Parameters: (overlappedPtr, libHandle, size, align)
                    ovPtr = Number(ovPtr);
                    libHandle = BigInt(libHandle);
                    size = BigInt(size);
                    align = Number(align);
                    
                    if (!hostState.dylibMem) {
                        hostState.dylibMem = new Map();
                        hostState.dylibMemCounter = 1000000n;
                    }
                    
                    const handle = hostState.dylibMemCounter++;
                    const buf = new Uint8Array(Number(size));
                    hostState.dylibMem.set(handle, buf);
                    
                    const view = new DataView(hostState.memory.buffer);
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    view.setBigUint64(ovPtr + 16, handle, true);
                    
                    console.log('[dylib_alloc] Allocated:', Number(size), 'bytes, handle:', handle);
                    return 0;
                },
                dylib_free: (ovPtr, libHandle, ptr) => {
                    // Free allocated dylib memory
                    // Parameters: (overlappedPtr, libHandle, ptr)
                    ovPtr = Number(ovPtr);
                    libHandle = BigInt(libHandle);
                    ptr = BigInt(ptr);
                    
                    const view = new DataView(hostState.memory.buffer);
                    
                    if (hostState.dylibMem && hostState.dylibMem.has(ptr)) {
                        hostState.dylibMem.delete(ptr);
                        console.log('[dylib_free] Freed handle:', ptr);
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 0, true);
                    } else {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 22, true); // EINVAL
                    }
                    return 0;
                },
                dylib_callback_register: (ovPtr, libHandle, sigPtr, sigLen, cbOvPtr, cbOvLen) => {
                    // Register a callback for dylib notifications
                    ovPtr = Number(ovPtr);
                    libHandle = BigInt(libHandle);
                    sigPtr = Number(sigPtr);
                    sigLen = Number(sigLen);
                    cbOvPtr = Number(cbOvPtr);
                    cbOvLen = Number(cbOvLen);
                    
                    console.log('[dylib_callback_register] Registering callback, libHandle:', libHandle);
                    
                    const view = new DataView(hostState.memory.buffer);
                    
                    // Create a unique callback handle
                    if (!hostState.callbackHandles) {
                        hostState.callbackHandles = new Map();
                        hostState.callbackCounter = 2000000n;
                    }
                    
                    const cbHandle = hostState.callbackCounter++;
                    hostState.callbackHandles.set(cbHandle, {
                        libHandle,
                        cbOvPtr,
                        cbOvLen,
                        sigPtr,
                        sigLen
                    });
                    
                    console.log('[dylib_callback_register] Registered callback handle:', cbHandle);
                    
                    // Return callback handle
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    view.setBigUint64(ovPtr + 16, cbHandle, true);
                    return 0;
                },
                dylib_retain: (handle) => {
                    // Reference counting stub
                    return 0;
                },
                dylib_release: (handle) => {
                    // Reference counting stub
                    return 0;
                },
                cancel: (...args) => {},
                get_platform_info: (outPtr, outLen) => {
                    const view = new DataView(hostState.memory.buffer);
                    outPtr = Number(outPtr);
                    const structSize = 548;
                    if (Number(outLen) < structSize) return 7; // E2BIG

                    const buf = new ArrayBuffer(structSize);
                    const dv = new DataView(buf);
                    dv.setUint32(0, 1, true);
                    dv.setUint8(4, 47);
                    dv.setUint8(5, 58);
                    dv.setUint16(6, 2, true);
                    dv.setUint16(16, 1, true);
                    dv.setUint8(18, 64);

                    const copyAscii = (dstOff, str) => {
                        const bytes = encoder.encode(str.slice(0, 63));
                        new Uint8Array(buf, dstOff, bytes.length).set(bytes);
                    };

                    copyAscii(20, 'browser');
                    copyAscii(84, 'rusticated-wasm');
                    copyAscii(156, 'wasm32');
                    copyAscii(220, 'rusticated');
                    copyAscii(284, '0.0.0-dev');
                    copyAscii(356, '0.0.0-dev');
                    copyAscii(420, new Date().toISOString().slice(0, 19));
                    copyAscii(484, 'browser-wasm32');

                    new Uint8Array(hostState.memory.buffer, outPtr, structSize).set(new Uint8Array(buf));
                    return 0;
                },
                tty_set_mode: (handle, mode) => {
                    console.log("TTY SET MODE:", { handle, mode, typeHandle: typeof handle, typeMode: typeof mode });
                },
                tty_get_size: (handle) => {
                    const size = (term.cols << 16) | term.rows;
                    console.log("TTY GET SIZE:", { handle, size, cols: term.cols, rows: term.rows });
                    return size;
                },
                fd_isatty: (handle) => {
                    console.log("FD_ISATTY:", handle);
                    handle = BigInt(handle);
                    if (handle >= 0n && handle <= 2n) return 1;
                    const h = hostState.handles.get(handle);
                    return (h && (h.type === 'tty' || h.type === 'stdin' || h.type === 'stdout' || h.type === 'stderr')) ? 1 : 0;
                },
                process_exit: (code) => {
                    code = Number(code);
                    console.log("Process exited with code", code);
                    if (code !== 0) {
                        term.write(`\r\n[Process exited with code ${code}]\r\n`);
                    }
                },
                rusticated_debug: (val) => console.log("GUEST DEBUG:", val),
            };

            const importObject = {
                env
            };

            // === HTTP Proxy Shim for Model Downloads ===
            class HTTPProxyShim {
                constructor() {
                    this.webModelCache = new Map();
                    this.downloadsInProgress = new Map();
                    console.log('[HTTPProxyShim] Initialized');
                }

                async handleModelRequest(url, desiredSize, onProgress) {
                    // Check memory cache first
                    if (this.webModelCache.has(url)) {
                        console.log('[HTTPProxyShim] Cache hit (memory):', url);
                        if (onProgress) {
                            const bytes = this.webModelCache.get(url);
                            onProgress({ received: bytes.length, total: bytes.length, percent: 100 });
                        }
                        return this.webModelCache.get(url);
                    }

                    // Check if download already in flight
                    if (this.downloadsInProgress.has(url)) {
                        console.log('[HTTPProxyShim] Awaiting in-flight download:', url);
                        return this.downloadsInProgress.get(url);
                    }

                    // Start new download with retries
                    console.log('[HTTPProxyShim] Starting download:', url);
                    const downloadPromise = this.fetchAndCache(url, onProgress);
                    this.downloadsInProgress.set(url, downloadPromise);

                    try {
                        const result = await downloadPromise;
                        this.webModelCache.set(url, result);
                        console.log('[HTTPProxyShim] Download complete, cached:', url.substring(0, 50) + '...');
                        return result;
                    } finally {
                        this.downloadsInProgress.delete(url);
                    }
                }

                async fetchAndCache(url, onProgress) {
                    const webModelUrl = this.mapToWebModelUrl(url);
                    console.log('[HTTPProxyShim] Fetching with retry support:', webModelUrl);

                    try {
                        // Use RobustHTTPFetcher for retries
                        const modelBytes = await fetcher.fetchWithProgress(webModelUrl, onProgress);
                        console.log('[HTTPProxyShim] Downloaded:', (modelBytes.length / 1024 / 1024).toFixed(1), 'MB');
                        return modelBytes;
                    } catch (err) {
                        console.error('[HTTPProxyShim] All download attempts failed:', err.message);
                        throw err;
                    }
                }

                mapToWebModelUrl(desktopUrl) {
                    // Map desktop Hugging Face URLs to web-optimized CDN URLs
                    console.log('[HTTPProxyShim] Mapping URL:', desktopUrl);
                    
                    if (desktopUrl.includes('gemma') || desktopUrl.includes('gemma-4')) {
                        const webUrl = 'https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it-web.litertlm';
                        console.log('[HTTPProxyShim] Mapped to web model:', webUrl);
                        return webUrl;
                    }
                    
                    // Log unmapped URLs for debugging
                    console.log('[HTTPProxyShim] No mapping found, using original URL');
                    return desktopUrl;
                }
            }

            // === Browser Asset State ===
            const browserAssetState = {
                bootstrapStarted: false,
                bootstrapComplete: false,
                lastError: null,
                modelCache: {},
                progress: new Map() // Track progress for each asset
            };

            const httpProxyShim = new HTTPProxyShim();

            // === Browser Asset Helpers ===
            function setBrowserAssetProgress(wasmFS, assetName, percent, message) {
                browserAssetState.progress.set(assetName, { percent, message, timestamp: Date.now() });
                console.log(`[Bootstrap] ${assetName}: ${percent}% - ${message}`);
                term.write(`[Bootstrap] ${assetName}: ${percent}% - ${message}\r\n`);
            }

            function ensureDirEntry(fs, path, mode = 0o755) {
                const now = Date.now();
                if (!fs.getEntrySync(path)) {
                    fs.entries.set(path, { path, type: 'dir', mtime: now, mode });
                    fs.putEntrySync({ path, type: 'dir', mtime: now, mode });
                    console.log(`[Bootstrap] Created directory: ${path}`);
                }
            }

            function ensureFileEntry(fs, path, contentOrBytes, mode = 0o644, mtime = Date.now(), reportedSize = undefined) {
                const content = contentOrBytes instanceof Uint8Array ? contentOrBytes : encoder.encode(contentOrBytes);
                const entry = { path, type: 'file', content, size: content.length, mtime, mode, reportedSize };
                fs.entries.set(path, entry);
                fs.putEntrySync(entry);
                const displaySize = reportedSize !== undefined ? reportedSize : content.length;
                console.log(`[Bootstrap] Created file: ${path} (reported: ${displaySize} bytes, actual content: ${content.length} bytes)`);
            }

            async function ensureGuestCacheStructure(fs) {
                console.log('[Bootstrap] Ensuring guest cache directory structure...');
                ensureDirEntry(fs, '/home/user/.cache', 0o755);
                ensureDirEntry(fs, '/home/user/.cache/kabibi', 0o755);
                ensureDirEntry(fs, '/home/user/.cache/kabibi/litert_cache', 0o755);
                ensureDirEntry(fs, '/home/user/.cache/kabibi/wheels_extracted', 0o755);
                console.log('[Bootstrap] Cache structure ready');
            }

            async function seedDesktopArtifactMetadata(fs, gemmaWebBytes) {
                console.log(`[Bootstrap] Seeding desktop artifact metadata (model size: ${gemmaWebBytes.length} bytes)...`);
                await ensureGuestCacheStructure(fs);

                // Create fake wheel extraction directory entry
                // Guest expects this file to exist and checks its size
                // We store minimal placeholder content but report the actual model size
                const wheelExtractPath = '/home/user/.cache/kabibi/wheels_extracted/pytorch_model.bin';
                ensureFileEntry(fs, wheelExtractPath, 'fake-wheel-content', 0o644, Date.now() - 1000, gemmaWebBytes.length);

                // Create fake .so entry (minimal content, reported model size)
                const soPath = '/home/user/.cache/kabibi/litert_lm_ext.so';
                ensureFileEntry(fs, soPath, 'fake-so-content', 0o755, Date.now(), gemmaWebBytes.length);

                console.log(`[Bootstrap] Desktop artifacts seeded with reported size: ${gemmaWebBytes.length} bytes`);
            }

            async function bootstrapBrowserAssets(wasmFS) {
                if (browserAssetState.bootstrapStarted) {
                    console.log('[Bootstrap] Already started, skipping');
                    return;
                }
                browserAssetState.bootstrapStarted = true;

                try {
                    console.log('[Bootstrap] Starting three-stage bootstrap...');

                    // === STAGE 1: LiteRT Runtime ===
                    console.log('[Bootstrap] Stage 1: Initializing LiteRT runtime from CDN');
                    setBrowserAssetProgress(wasmFS, 'litertlm', 50, 'Loading Engine from CDN...');
                    // Note: Full Engine load deferred until we have model bytes in Stage 3
                    // This stage ensures CDN import is available
                    setBrowserAssetProgress(wasmFS, 'litertlm', 100, 'Runtime ready');

                    // === STAGE 2: Gemma Model Cache ===
                    console.log('[Bootstrap] Stage 2: Ensuring Gemma web model cached');
                    setBrowserAssetProgress(wasmFS, 'gemma', 0, 'Checking cache...');

                    // Check if model is in persistent cache first
                    const modelUrl = 'https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it-web.litertlm';
                    let gemmaWebBytes = null;

                    const cachedModel = await modelStore.loadModel(modelUrl);
                    if (cachedModel) {
                        console.log('[Bootstrap] Model found in persistent cache');
                        gemmaWebBytes = cachedModel.bytes;
                        setBrowserAssetProgress(wasmFS, 'gemma', 100, 'Loaded from cache');
                    } else {
                        console.log('[Bootstrap] Model not in cache, downloading...');
                        gemmaWebBytes = await httpProxyShim.handleModelRequest(
                            modelUrl,
                            undefined,
                            (progress) => {
                                const percent = Math.max(1, Math.min(99, progress.percent));
                                setBrowserAssetProgress(wasmFS, 'gemma', percent, `Downloading: ${percent}%`);
                            }
                        );
                        // Save to persistent cache
                        await modelStore.saveModel(modelUrl, gemmaWebBytes, { name: 'gemma-4-E4B-it-web' });
                        setBrowserAssetProgress(wasmFS, 'gemma', 100, 'Cached & Ready');
                    }
                    setBrowserAssetProgress(wasmFS, 'gemma', 100, 'Cached');

                    // === STAGE 3: Initialize Engine with Model ===
                    console.log('[Bootstrap] Stage 3: Initializing LiteRT Engine with Gemma model');
                    setBrowserAssetProgress(wasmFS, 'engine', 50, 'Initializing engine...');
                    await engineManager.initialize(gemmaWebBytes);
                    setBrowserAssetProgress(wasmFS, 'engine', 100, 'Engine ready');

                    // === STAGE 4: Seed Guest FS ===
                    console.log('[Bootstrap] Stage 4: Seeding guest filesystem with metadata');
                    setBrowserAssetProgress(wasmFS, 'fs', 50, 'Seeding FS...');
                    await seedDesktopArtifactMetadata(wasmFS, gemmaWebBytes);
                    setBrowserAssetProgress(wasmFS, 'fs', 100, 'Complete');

                    browserAssetState.bootstrapComplete = true;
                    
                    // === PHASE 3: Initialize Multi-Model & Advanced Features ===
                    console.log('[Phase 3] Initializing advanced features...');
                    await initializePhase3();
                    
                    console.log('[Bootstrap] Completed successfully');
                } catch (err) {
                    browserAssetState.lastError = err;
                    console.error('[Bootstrap] Failed:', err);
                    term.write(`\r\n\x1b[31m[Bootstrap Failed]: ${err.message}\x1b[0m\r\n`);
                }
            }

            try {
                console.log("Fetching WASM from ./try/kabibi.wasm");
                const response = await fetch('./try/kabibi.wasm');
                console.log("Fetch response:", response.status);
                if (!response.ok) throw new Error(`HTTP ${response.status} fetching WASM`);
                const binary = await response.arrayBuffer();
                console.log("Binary size:", binary.byteLength);
                const { instance } = await WebAssembly.instantiate(binary, importObject);
                console.log("WASM instantiated.");
                window.lastInstance = instance;
                hostState.memory = instance.exports.memory;
                // Bubble Tea and the rusticated runtime usually wait for the first
                // SIGWINCH before drawing; without a synthetic initial resize the
                // TUI can sit forever in the browser host.
                hostState.triggerSignal(28);
                
                console.log("WASM Exports:", Object.keys(instance.exports));
                term.write('WASM loaded. Starting kabibi...\r\n\r\n');
                
                const runFunc = instance.exports.run || instance.exports._start;
                if (runFunc) {
                    const runLoop = () => {
                        try {
                            const res = runFunc();
                            const r = Number(res);
                            if (r === 0) {
                                term.write('\r\n[Process Finished]\r\n');
                                return;
                            }
                            // 1ms instead of 0ms for active yielding to prevent event loop starvation
                            setTimeout(runLoop, (r === 2 || r === 4) ? 1 : 10);
                        } catch (e) {
                            console.error("Runtime error:", e);
                            term.write(`\r\n\x1b[31mRuntime Error: ${e.message}\x1b[0m\r\n`);
                        }
                    };
                    runLoop();
                } else {
                    term.write('Error: No entry point found in WASM.\r\n');
                }
            } catch (err) {
                console.error(err);
                term.write(`\r\nFailed to load kabibi: ${err.message}\r\n`);
            }
        }

        // Phase 3 Initialization Function
        async function initializePhase3() {
            console.log('[Phase 3] Initializing Phase 3 components...');
            
            try {
                // Create Phase 3 components
                multiModelManager = new MultiModelManager();
                advancedTokenStreamer = new AdvancedTokenStreamer();
                memoryOptimizer = new MemoryOptimizer();
                cacheUI = new CacheManagementUI();
                uiEnhancements = new UIEnhancements();
                
                // Load model catalog
                multiModelManager.loadDefaultCatalog();
                
                // Initialize batch processor if engine is ready
                if (engineManager) {
                    batchInferenceProcessor = new BatchInferenceProcessor(engineManager, 2);
                }
                
                // Start memory monitoring
                await memoryOptimizer.startMonitoring();
                
                // Mount cache UI
                const cacheContainer = document.getElementById('cache-container');
                if (cacheContainer) {
                    cacheUI.mount('cache-container');
                }
                
                // Setup UI enhancements
                await uiEnhancements.initUI();
                
                console.log('[Phase 3] ✅ Phase 3 ready!');
                window.dispatchEvent(new CustomEvent('phase3Ready'));
            } catch (e) {
                console.error('[Phase 3] Initialization failed:', e);
            }
        }

        window.onload = () => {
            const contentDiv = document.getElementById('content');
            
            try {
                if (typeof __README__ === 'function') {
                    const funcStr = __README__.toString();
                    const startIdx = funcStr.indexOf('/*') + 2;
                    const endIdx = funcStr.lastIndexOf('*/');
                    
                    if (startIdx !== -1 && endIdx !== -1) {
                        let rawMarkdown = funcStr.substring(startIdx, endIdx);
                        rawMarkdown = rawMarkdown.replace(/^\s*-->\s*/, '').replace(/\s*<!--\s*$/, '');
                        contentDiv.innerHTML = marked.parse(rawMarkdown);
                    } else {
                        throw new Error("Could not find polyglot comment boundaries.");
                    }
                } else {
                    throw new Error("__README__ function not found in README.md script payload.");
                }
            } catch (err) {
                console.error(err);
                contentDiv.innerHTML = `<p id="error-msg">Failed to load README.md.<br><small>${err.message}</small></p>`;
            }

            document.getElementById('main-body').style.opacity = 1;

            // Initialize Terminal and WASM
            initTerminalAndWasm();
        };
    </script>
