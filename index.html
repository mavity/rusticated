    <script type="module" src="mohabbat/washmhost.js"></script>

    <script>
        const encoder = new TextEncoder();
        const decoder = new TextDecoder();
        const termDecoder = new TextDecoder();


        // --- WASM Host Implementation ---
        async function initTerminalAndWasm() {

            let modelStore, fetcher, engineManager, callbackStreamer;

            console.log("initTerminalAndWasm START");
            const term = new Terminal({
                cursorBlink: true,
                allowProposedApi: true,
                fontFamily: 'Consolas, "Cascadia Mono", "Fira Code", Menlo, monospace'
            });
            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            window.term = term;

            term.open(document.getElementById('terminal-container'));
            fitAddon.fit();
            window.addEventListener('resize', () => {
                fitAddon.fit();
                if (window.hostState && window.hostState.triggerSignal) {
                    window.hostState.triggerSignal(28); // SIGWINCH
                }
            });

            term.write('Connecting to kabibi WASM...\r\n');
            console.log('[TRACE] After terminal creation');

            // Host controller instance managed by washmhost
            let host = null;
            const hostState = {
                get memory() { return host?.getMemory() || null; },
                triggerSignal: (sig) => host?.triggerSignal(sig),
                pushStdin: (data) => host?.pushStdin(data)
            };
            window.hostState = hostState;

            const armBootstrap = () => {
                browserAssetState.bootstrapArmed = true;
            };

            term.onData(data => {
                armBootstrap();
                hostState.pushStdin(data);
            });

            // Extension state for LiteRT dylib and HTTP proxy shims
            const dylibHandles = new Map();
            let nextDylibHandle = 100n;
            const dylibMem = new Map();
            let nextDylibMem = 1000000n;


            // === HTTP Proxy Shim for Model Downloads ===
            class HTTPProxyShim {
                constructor(fetcher) {
                    this.fetcher = fetcher;
                    this.webModelCache = new Map();
                    this.downloadsInProgress = new Map();
                    console.log('[HTTPProxyShim] Initialized with fetcher');
                }

                async handleModelRequest(url, desiredSize, onProgress) {
                    // Check memory cache first
                    if (this.webModelCache.has(url)) {
                        console.log('[HTTPProxyShim] Cache hit (memory):', url);
                        if (onProgress) {
                            const bytes = this.webModelCache.get(url);
                            onProgress({ received: bytes.length, total: bytes.length, percent: 100 });
                        }
                        return this.webModelCache.get(url);
                    }

                    // Check if download already in flight
                    if (this.downloadsInProgress.has(url)) {
                        console.log('[HTTPProxyShim] Awaiting in-flight download:', url);
                        return this.downloadsInProgress.get(url);
                    }

                    // Start new download with retries
                    console.log('[HTTPProxyShim] Starting download:', url);
                    const downloadPromise = this.fetchAndCache(url, onProgress);
                    this.downloadsInProgress.set(url, downloadPromise);

                    try {
                        const result = await downloadPromise;
                        this.webModelCache.set(url, result);
                        console.log('[HTTPProxyShim] Download complete, cached:', url.substring(0, 50) + '...');
                        return result;
                    } finally {
                        this.downloadsInProgress.delete(url);
                    }
                }

                async fetchAndCache(url, onProgress) {
                    const webModelUrl = this.mapToWebModelUrl(url);
                    console.log('[HTTPProxyShim] Fetching with retry support:', webModelUrl);

                    try {
                        // Use RobustHTTPFetcher for retries
                        const modelBytes = await this.fetcher.fetchWithProgress(webModelUrl, onProgress);
                        console.log('[HTTPProxyShim] Downloaded:', (modelBytes.length / 1024 / 1024).toFixed(1), 'MB');
                        return modelBytes;
                    } catch (err) {
                        console.error('[HTTPProxyShim] All download attempts failed:', err.message);
                        throw err;
                    }
                }

                mapToWebModelUrl(desktopUrl) {
                    // Map desktop Hugging Face URLs to web-optimized CDN URLs
                    console.log('[HTTPProxyShim] Mapping URL:', desktopUrl);
                    
                    if (desktopUrl.includes('gemma') || desktopUrl.includes('gemma-4')) {
                        const webUrl = 'https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it-web.litertlm';
                        console.log('[HTTPProxyShim] Mapped to web model:', webUrl);
                        return webUrl;
                    }
                    
                    // Log unmapped URLs for debugging
                    console.log('[HTTPProxyShim] No mapping found, using original URL');
                    return desktopUrl;
                }
            }

            // === Browser Asset State ===
            const browserAssetState = {
                bootstrapStarted: false,
                bootstrapComplete: false,
                bootstrapArmed: false,
                webModelFromCache: false,
                webModelBytes: null,
                lastError: null,
                modelCache: {},
                progress: new Map() // Track progress for each asset
            };

            console.log('[DEBUG] About to create HTTPProxyShim with fetcher:', typeof fetcher);
            const httpProxyShim = new HTTPProxyShim(fetcher);
            console.log('[DEBUG] HTTPProxyShim created successfully');

            // === Browser Debug Helpers ===
            window._debug_term = {
                term,
                hostState,
                browserAssetState,
                command: async (cmd) => {
                    if (!term) return 'Terminal not ready';
                    term.write(cmd + '\r\n');
                    // Send input to WASM via stdin with proper line ending
                    hostState.pushStdin(cmd + '\r\n');
                    return `Sent: ${cmd}`;
                },
                send: (text) => {
                    if (!term) return 'Terminal not ready';
                    term.write(text + '\r\n');
                    hostState.pushStdin(text + '\r\n');
                    return `Sent: ${text}`;
                },
                type: (text) => {
                    if (!term) return 'Terminal not ready';
                    term.write(text);
                    hostState.pushStdin(text);
                    return `Typed: ${text}`;
                },
                pressEnter: () => {
                    term.write('\r\n');
                    hostState.pushStdin('\r\n');
                    return 'Enter pressed';
                },
                getOutput: () => {
                    if (!term) return 'Terminal not ready';
                    try {
                        const lines = [];
                        const buffer = term.buffer.active;
                        if (buffer && buffer.length) {
                            for (let y = 0; y < Math.min(buffer.length, 100); y++) {
                                let line = '';
                                const lineData = buffer.getLine(y);
                                if (lineData) {
                                    for (let x = 0; x < lineData.length; x++) {
                                        const cell = lineData.getCell(x);
                                        if (cell) {
                                            line += cell.getChars && cell.getChars() ? cell.getChars() : cell.char || ' ';
                                        } else {
                                            line += ' ';
                                        }
                                    }
                                }
                                lines.push(line.trimEnd());
                            }
                        }
                        return lines.join('\n');
                    } catch (e) {
                        // Fallback: try to extract from DOM
                        try {
                            const rows = term.element?.querySelectorAll('.xterm-row');
                            const output = [];
                            if (rows) {
                                for (const row of rows) {
                                    output.push(row.textContent || '');
                                }
                            }
                            return output.join('\n');
                        } catch (e2) {
                            return `Terminal output unavailable: ${e.message}`;
                        }
                    }
                },
                getBootstrapState: () => {
                    return {
                        bootstrapStarted: browserAssetState.bootstrapStarted,
                        bootstrapComplete: browserAssetState.bootstrapComplete,
                        webModelFromCache: browserAssetState.webModelFromCache,
                        webModelBytesSize: browserAssetState.webModelBytes?.length || 0,
                        lastError: browserAssetState.lastError?.message || null,
                        timestamp: Date.now()
                    };
                },
                getTerminal: () => term,
                getHostState: () => hostState
            };

            // === Browser Asset Helpers ===
            function setBrowserAssetProgress(wasmFS, assetName, percent, message) {
                browserAssetState.progress.set(assetName, { percent, message, timestamp: Date.now() });
                console.log(`[Bootstrap] ${assetName}: ${percent}% - ${message}`);
                term.write(`[Bootstrap] ${assetName}: ${percent}% - ${message}\r\n`);
            }

            async function ensureDirEntry(fs, path, mode = 0o755) {
                const now = Date.now();
                if (fs && fs.getEntry) {
                    const existing = await fs.getEntry(path);
                    if (!existing) {
                        await fs.putEntry({ path, type: 'dir', mtime: now, mode });
                        console.log(`[Bootstrap] Created directory: ${path}`);
                    }
                }
            }

            async function ensureFileEntry(fs, path, contentOrBytes, mode = 0o644, mtime = Date.now(), reportedSize = undefined) {
                const content = contentOrBytes instanceof Uint8Array ? contentOrBytes : encoder.encode(contentOrBytes);
                const entry = { path, type: 'file', content, size: content.length, mtime, mode, reportedSize };
                if (fs && fs.putEntry) {
                    await fs.putEntry(entry);
                }
                const displaySize = reportedSize !== undefined ? reportedSize : content.length;
                console.log(`[Bootstrap] Created file: ${path} (reported: ${displaySize} bytes, actual content: ${content.length} bytes)`);
            }

            async function ensureGuestCacheStructure(fs) {
                console.log('[Bootstrap] Ensuring guest cache directory structure...');
                await ensureDirEntry(fs, '/home/user/.cache', 0o755);
                await ensureDirEntry(fs, '/home/user/.cache/kabibi', 0o755);
                await ensureDirEntry(fs, '/home/user/.cache/kabibi/litert_cache', 0o755);
                await ensureDirEntry(fs, '/home/user/.cache/kabibi/wheels_extracted', 0o755);
                console.log('[Bootstrap] Cache structure ready');
            }

            async function seedDesktopArtifactMetadata(fs, gemmaWebBytesSize, hasModelCached) {
                console.log(`[Bootstrap] Seeding desktop artifact metadata...`);
                await ensureGuestCacheStructure(fs);

                // === UNCONDITIONAL SEEDING ===
                // Always seed wheel file with fake content (small, reports actual content size)
                const wheelExtractPath = '/home/user/.cache/kabibi/wheels_extracted/pytorch_model.bin';
                await ensureFileEntry(fs, wheelExtractPath, 'fake-wheel', 0o644, Date.now() - 1000);
                // Note: reportedSize omitted - will report actual content size (small placeholder)

                // Always seed .so file with fake content (small, reports actual content size)
                const soPath = '/home/user/.cache/kabibi/litert_lm_ext.so';
                await ensureFileEntry(fs, soPath, 'fake-so', 0o755, Date.now());
                // Note: reportedSize omitted - will report actual content size (small placeholder)

                // === CONDITIONAL SEEDING ===
                // Only seed model file if web model is cached
                if (hasModelCached) {
                    const modelPath = '/home/user/.cache/kabibi/litert_cache/gemma-4-E4B-it-web.litertlm';
                    await ensureFileEntry(fs, modelPath, 'fake-model-zeros', 0o644, Date.now(), gemmaWebBytesSize);
                    console.log(`[Bootstrap] Model file seeded (cached): ${modelPath}, reported size: ${gemmaWebBytesSize} bytes`);
                } else {
                    console.log(`[Bootstrap] Model file NOT seeded (cache miss - guest must download)`);
                }

                console.log(`[Bootstrap] Desktop artifacts seeded successfully`);
            }

            // === Cache API Model Store for Bootstrap ===
            const CACHE_NAME = 'kabibi-web-models-v1';
            const WEB_MODEL_URL = 'https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it-web.litertlm';

            modelStore = {
                cacheName: CACHE_NAME,
                modelUrl: WEB_MODEL_URL,

                async checkCached() {
                    if (!window.caches) return null;
                    try {
                        const cache = await caches.open(this.cacheName);
                        const response = await cache.match(this.modelUrl);
                        return response ? response.clone() : null;
                    } catch (e) {
                        if (DEBUG) console.error('[ModelStore] Error checking cache:', e);
                        return null;
                    }
                },

                async saveModel(bytes) {
                    if (!window.caches) return false;
                    try {
                        const cache = await caches.open(this.cacheName);
                        const blob = new Blob([bytes]);
                        const response = new Response(blob, {
                            status: 200,
                            headers: { 'Content-Length': bytes.length.toString() }
                        });
                        await cache.put(this.modelUrl, response);
                        if (DEBUG) console.log('[ModelStore] Saved', (bytes.length / 1024 / 1024).toFixed(1), 'MB to cache');
                        return true;
                    } catch (e) {
                        if (DEBUG) console.error('[ModelStore] Error saving model:', e);
                        return false;
                    }
                }
            };

            async function bootstrapBrowserAssets(wasmFS) {
                if (browserAssetState.bootstrapStarted) {
                    console.log('[Bootstrap] Already started, skipping');
                    return;
                }
                browserAssetState.bootstrapStarted = true;

                try {
                    console.log('[Bootstrap] Starting lazy bootstrap...');

                    // === STAGE 1: Initialize LiteRT Runtime (Async, no download) ===
                    console.log('[Bootstrap] Stage 1: Initializing LiteRT web library');
                    // Asynchronously load litertlm-web JS library (no wait)
                    // This allows guest to continue while initialization happens

                    // === STAGE 2: Check Cache (No Download on Cache Miss!) ===
                    console.log('[Bootstrap] Stage 2: Checking Cache API for model');
                    let hasModelCached = false;
                    let modelBytesSize = 0;

                    const cachedResponse = await modelStore.checkCached();
                    if (cachedResponse) {
                        console.log('[Bootstrap] Model found in Cache API');
                        hasModelCached = true;
                        try {
                            const cachedBytes = new Uint8Array(await cachedResponse.arrayBuffer());
                            modelBytesSize = cachedBytes.length;
                            browserAssetState.webModelFromCache = true;
                            browserAssetState.webModelBytes = cachedBytes;
                            console.log('[Bootstrap] Model size:', (modelBytesSize / 1024 / 1024).toFixed(1), 'MB');
                        } catch (e) {
                            console.error('[Bootstrap] Error reading cached model:', e);
                        }
                    } else {
                        console.log('[Bootstrap] Model NOT in Cache API (guest will download via HTTP interception)');
                    }

                    // === STAGE 3: Seed Guest Filesystem ===
                    console.log('[Bootstrap] Stage 3: Seeding guest filesystem metadata');
                    await seedDesktopArtifactMetadata(wasmFS, modelBytesSize, hasModelCached);

                    browserAssetState.bootstrapComplete = true;
                    console.log('[Bootstrap] Completed - guest ready');
                } catch (err) {
                    browserAssetState.lastError = err;
                    console.error('[Bootstrap] Failed:', err);
                    term.write(`\r\n\x1b[31m[Bootstrap Failed]: ${err.message}\x1b[0m\r\n`);
                }
            }

            // === Network & Dynamic Library Extensions ===
            const netExtension = {
                open: (addr, port, flags) => {
                    if ((addr === '127.0.0.1' || addr === 'localhost') && port === 8888) {
                        let requestBytes = [];
                        let responseBytes = null;
                        let responseOffset = 0;
                        let pendingReads = [];
                        let preparing = false;

                        return {
                            write: (chunk) => {
                                for (let i = 0; i < chunk.length; i++) requestBytes.push(chunk[i]);
                                const text = decoder.decode(new Uint8Array(requestBytes));
                                const headerEnd = text.indexOf('\r\n\r\n');
                                if (headerEnd !== -1 && !preparing) {
                                    preparing = true;
                                    const match = text.match(/GET\s+([^\s]+)\s+HTTP/i);
                                    let url = match ? match[1] : '';
                                    if (url.startsWith('/')) url = 'https://huggingface.co' + url;

                                    httpProxyShim.handleModelRequest(url, undefined, (progress) => {
                                        setBrowserAssetProgress(null, 'Model Download', progress.percent, `${progress.received}/${progress.total} bytes`);
                                    }).then(bodyBytes => {
                                        const header = `HTTP/1.1 200 OK\r\nContent-Length: ${bodyBytes.length}\r\nContent-Type: application/octet-stream\r\n\r\n`;
                                        const headerBytes = encoder.encode(header);
                                        const fullResp = new Uint8Array(headerBytes.length + bodyBytes.length);
                                        fullResp.set(headerBytes, 0);
                                        fullResp.set(bodyBytes, headerBytes.length);
                                        responseBytes = fullResp;
                                        responseOffset = 0;

                                        while (pendingReads.length > 0) {
                                            const r = pendingReads.shift();
                                            r();
                                        }
                                    }).catch(err => {
                                        console.error('[NetProxy] Download failed:', err);
                                        const header = `HTTP/1.1 502 Bad Gateway\r\nContent-Length: 0\r\n\r\n`;
                                        responseBytes = encoder.encode(header);
                                        responseOffset = 0;
                                        while (pendingReads.length > 0) {
                                            const r = pendingReads.shift();
                                            r();
                                        }
                                    });
                                }
                            },
                            read: (maxLen) => {
                                if (responseBytes) {
                                    const avail = responseBytes.length - responseOffset;
                                    const toRead = Math.min(maxLen, Math.max(0, avail));
                                    if (toRead > 0) {
                                        const slice = responseBytes.subarray(responseOffset, responseOffset + toRead);
                                        responseOffset += toRead;
                                        return Promise.resolve(slice);
                                    }
                                    return Promise.resolve(new Uint8Array(0));
                                }
                                return new Promise((resolve) => {
                                    pendingReads.push(() => {
                                        const avail = responseBytes ? responseBytes.length - responseOffset : 0;
                                        const toRead = Math.min(maxLen, Math.max(0, avail));
                                        if (toRead > 0 && responseBytes) {
                                            const slice = responseBytes.subarray(responseOffset, responseOffset + toRead);
                                            responseOffset += toRead;
                                            resolve(slice);
                                        } else {
                                            resolve(new Uint8Array(0));
                                        }
                                    });
                                });
                            }
                        };
                    }
                    return null;
                }
            };

            const dylibExtension = {
                alloc: (libHandle, size, align) => {
                    const byteLength = Number(size);
                    const alignment = BigInt(align || 1);
                    if (!Number.isSafeInteger(byteLength) || byteLength < 0 || alignment <= 0n) {
                        const error = new Error('Invalid dynamic-library allocation size or alignment');
                        error.code = 'EINVAL';
                        throw error;
                    }

                    const ptr = ((nextDylibMem + alignment - 1n) / alignment) * alignment;
                    let bytes;
                    try {
                        bytes = new Uint8Array(byteLength);
                    } catch {
                        const error = new Error('Dynamic-library allocation failed');
                        error.code = 'ENOMEM';
                        throw error;
                    }
                    dylibMem.set(ptr, { libHandle: BigInt(libHandle), bytes });
                    nextDylibMem = ptr + BigInt(Math.max(byteLength, 1));
                    return ptr;
                },
                free: (libHandle, ptr) => {
                    const address = BigInt(ptr);
                    const allocation = dylibMem.get(address);
                    if (!allocation || allocation.libHandle !== BigInt(libHandle)) {
                        const error = new Error('Unknown dynamic-library allocation');
                        error.code = 'EINVAL';
                        throw error;
                    }
                    dylibMem.delete(address);
                },
                readMem: (libHandle, ptr, length) => {
                    const address = BigInt(ptr);
                    const byteLength = Number(length);
                    for (const [base, allocation] of dylibMem) {
                        const end = address + BigInt(byteLength);
                        if (
                            allocation.libHandle === BigInt(libHandle) &&
                            address >= base &&
                            end <= base + BigInt(allocation.bytes.length)
                        ) {
                            const offset = Number(address - base);
                            return allocation.bytes.slice(offset, offset + byteLength);
                        }
                    }
                    const error = new Error('Dynamic-library memory read is out of bounds');
                    error.code = 'EFAULT';
                    throw error;
                },
                writeMem: (libHandle, ptr, bytes) => {
                    const address = BigInt(ptr);
                    for (const [base, allocation] of dylibMem) {
                        const end = address + BigInt(bytes.length);
                        if (
                            allocation.libHandle === BigInt(libHandle) &&
                            address >= base &&
                            end <= base + BigInt(allocation.bytes.length)
                        ) {
                            const offset = Number(address - base);
                            allocation.bytes.set(bytes, offset);
                            return;
                        }
                    }
                    const error = new Error('Dynamic-library memory write is out of bounds');
                    error.code = 'EFAULT';
                    throw error;
                },
                open: (libPath, flags) => {
                    console.log('[dylib_open] Loading:', libPath);
                    if (libPath.includes('litert') || libPath.includes('lm_ext')) {
                        const handle = nextDylibHandle++;
                        dylibHandles.set(handle, {
                            type: 'dylib',
                            libPath,
                            engine: engineManager,
                            conversation: null,
                            isStreaming: false
                        });
                        return handle;
                    }
                    return null;
                },
                resolveSymbol: (libHandle, name) => {
                    const h = dylibHandles.get(libHandle);
                    if (!h || h.type !== 'dylib') return null;
                    const symbols = {
                        'litert_lm_engine_create': 'engineCreate',
                        'litert_lm_conversation_create': 'conversationCreate',
                        'litert_lm_conversation_send_message_stream': 'conversationSendStream',
                        'litert_lm_stream_chunk_get_text': 'streamGetText',
                        'litert_lm_stream_read_chunk': 'streamReadChunk',
                        'litert_lm_stream_close': 'streamClose'
                    };
                    if (symbols[name]) {
                        const symHandle = nextDylibHandle++;
                        dylibHandles.set(symHandle, {
                            type: 'dylib_sym',
                            libHandle,
                            symbolName: name,
                            fnName: symbols[name]
                        });
                        return symHandle;
                    }
                    return null;
                },
                call: async (symHandle, descPtr, descLen, ctx) => {
                    const h = dylibHandles.get(symHandle);
                    if (!h || h.type !== 'dylib_sym') return 0;
                    const libH = dylibHandles.get(h.libHandle);
                    if (!libH) return 0;

                    console.log('[dylib_call] Invoking:', h.symbolName);
                    if (h.fnName === 'engineCreate') {
                        if (libH.engine && !libH.engine.isInitialized) {
                            let bootTries = 0;
                            while (!browserAssetState.bootstrapComplete && bootTries < 300) {
                                await new Promise(r => setTimeout(r, 100));
                                bootTries++;
                            }
                            const modelBytes = httpProxyShim.webModelCache.values().next().value;
                            if (modelBytes) await libH.engine.initialize(modelBytes);
                        }
                    } else if (h.fnName === 'conversationCreate') {
                        if (libH.engine) libH.conversation = await libH.engine.createConversation();
                    } else if (h.fnName === 'conversationSendStream') {
                        if (libH.conversation) {
                            libH.isStreaming = true;
                            const userMessage = 'Hello, how are you?';
                            if (callbackStreamer) {
                                const callbackId = callbackStreamer.createCallback(
                                    (token) => callbackStreamer.streamToken(callbackId, token),
                                    (fullResponse) => {
                                        callbackStreamer.completeCallback(callbackId, fullResponse);
                                        libH.isStreaming = false;
                                    }
                                );
                                await libH.engine.streamMessage(
                                    libH.conversation,
                                    userMessage,
                                    (token) => callbackStreamer.streamToken(callbackId, token),
                                    (response) => callbackStreamer.completeCallback(callbackId, response)
                                );
                            }
                        }
                    }
                    return 0;
                }
            };

            try {
                term.write('Loading kabibi with washmhost...\r\n');
                host = await window.washmhost({
                    wasm: './try/kabibi.wasm',
                    stdout: (bytes) => term.write(bytes),
                    stderr: (bytes) => term.write(bytes),
                    getTtySize: () => ({ cols: term.cols, rows: term.rows }),
                    setTtySize: (cols, rows) => term.resize(cols, rows),
                    extensions: {
                        net: netExtension,
                        dylib: dylibExtension
                    },
                    onExit: (code) => {
                        console.log("Process exited with code", code);
                        if (code !== 0) {
                            term.write(`\r\n[Process exited with code ${code}]\r\n`);
                        } else {
                            term.write('\r\n[Process Finished]\r\n');
                        }
                    }
                });
                window.lastInstance = host.getInstance ? host.getInstance() : null;
                console.log("[washmhost] Host and guest launched successfully.");

                // Lazy background bootstrap of guest filesystem artifacts
                bootstrapBrowserAssets(host.getFS()).catch(err => {
                    console.error('[Bootstrap] Background error:', err);
                });
            } catch (err) {
                console.error(err);
                term.write(`\r\nFailed to load kabibi: ${err.message}\r\n`);
            }
        }

        // Phase 3 Initialization Function
        async function initializePhase3() {
            console.log('[Phase 3] Initializing Phase 3 components...');
            
            try {
                // Create Phase 3 components
                multiModelManager = new MultiModelManager();
                advancedTokenStreamer = new AdvancedTokenStreamer();
                memoryOptimizer = new MemoryOptimizer();
                cacheUI = new CacheManagementUI();
                uiEnhancements = new UIEnhancements();
                
                // Load model catalog
                multiModelManager.loadDefaultCatalog();
                
                // Initialize batch processor if engine is ready
                if (engineManager) {
                    batchInferenceProcessor = new BatchInferenceProcessor(engineManager, 2);
                }
                
                // Start memory monitoring
                await memoryOptimizer.startMonitoring();
                
                // Mount cache UI
                const cacheContainer = document.getElementById('cache-container');
                if (cacheContainer) {
                    cacheUI.mount('cache-container');
                }
                
                // Setup UI enhancements
                await uiEnhancements.initUI();
                
                console.log('[Phase 3] ✅ Phase 3 ready!');
                window.dispatchEvent(new CustomEvent('phase3Ready'));
            } catch (e) {
                console.error('[Phase 3] Initialization failed:', e);
            }
        }

        window.onload = () => {
            const contentDiv = document.getElementById('content');
            
            try {
                if (typeof __README__ === 'function') {
                    const funcStr = __README__.toString();
                    const startIdx = funcStr.indexOf('/*') + 2;
                    const endIdx = funcStr.lastIndexOf('*/');
                    
                    if (startIdx !== -1 && endIdx !== -1) {
                        let rawMarkdown = funcStr.substring(startIdx, endIdx);
                        rawMarkdown = rawMarkdown.replace(/^\s*-->\s*/, '').replace(/\s*<!--\s*$/, '');
                        contentDiv.innerHTML = marked.parse(rawMarkdown);
                    } else {
                        throw new Error("Could not find polyglot comment boundaries.");
                    }
                } else {
                    throw new Error("__README__ function not found in README.md script payload.");
                }
            } catch (err) {
                console.error(err);
                contentDiv.innerHTML = `<p id="error-msg">Failed to load README.md.<br><small>${err.message}</small></p>`;
            }

            document.getElementById('main-body').style.opacity = 1;

            // Initialize Terminal and WASM
            initTerminalAndWasm();
        };
    </script>
</body>
