    <!-- 
      Pull in README.md dynamically.
      This works over file:// purely because README.md is polyglot Javascript and Markdown 
    -->
    <script src="README.md"></script>

    <script>
        const encoder = new TextEncoder();
        const decoder = new TextDecoder();
        const termDecoder = new TextDecoder();

        // --- IndexedDB Mock Filesystem (Synchronous in-memory with background persistence) ---
        class IndexedDBFS {
            constructor(dbName = 'RusticatedFS') {
                this.dbName = dbName;
                this.db = null;
                this.entries = new Map();
            }

            async init() {
                this.db = await new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('files')) {
                            db.createObjectStore('files', { keyPath: 'path' });
                        }
                    };
                    request.onsuccess = (e) => resolve(e.target.result);
                    request.onerror = (e) => reject(e.target.error);
                });

                // Load all entries into memory
                const allEntries = await new Promise((resolve, reject) => {
                    const tx = this.db.transaction('files', 'readonly');
                    const store = tx.objectStore('files');
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.target.error);
                });

                for (const e of allEntries) {
                    this.entries.set(e.path, e);
                }
            }

            seed() {
                const now = Date.now();
                const initialFiles = [
                    { path: '/', type: 'dir', mtime: now },
                    { path: '/bin', type: 'dir', mtime: now },
                    { path: '/etc', type: 'dir', mtime: now },
                    { path: '/etc/hosts', type: 'file', content: encoder.encode('127.0.0.1 localhost\n'), mtime: now },
                    { path: '/etc/hostname', type: 'file', content: encoder.encode('rusticated-wasm\n'), mtime: now },
                    { path: '/etc/passwd', type: 'file', content: encoder.encode('root:x:0:0:root:/root:/bin/sh\nuser:x:1000:1000:user:/home/user:/bin/sh\n'), mtime: now },
                    { path: '/etc/group', type: 'file', content: encoder.encode('root:x:0:\nuser:x:1000:\n'), mtime: now },
                    { path: '/etc/motd', type: 'file', content: encoder.encode('Welcome to the Rusticated WASM environment!\nToday is a good day for hacking.\nType \'ls\' to see files and \'cat /etc/motd\' to read them.\n'), mtime: now },
                    { path: '/home', type: 'dir', mtime: now },
                    { path: '/home/user', type: 'dir', mtime: now },
                    { path: '/home/user/.bashrc', type: 'file', content: encoder.encode('alias ls="ls --color=auto"\nalias ll="ls -la"\n'), mtime: now },
                    { path: '/home/user/test.txt', type: 'file', content: encoder.encode('This is a test file in IndexedDB.\nIt persists across reloads!\n'), mtime: now },
                    { path: '/usr', type: 'dir', mtime: now },
                    { path: '/usr/bin', type: 'dir', mtime: now },
                    { path: '/usr/lib', type: 'dir', mtime: now },
                    { path: '/usr/local', type: 'dir', mtime: now },
                    { path: '/var', type: 'dir', mtime: now },
                    { path: '/var/log', type: 'dir', mtime: now },
                    { path: '/var/tmp', type: 'dir', mtime: now },
                    { path: '/tmp', type: 'dir', mtime: now },
                    { path: '/dev', type: 'dir', mtime: now },
                    { path: '/README.md', type: 'file', content: encoder.encode('# Rusticated WASM Shell\n\nWelcome to kabibi-go running in the browser.\nThis environment features a virtualized file system backed by IndexedDB.\n\nEnjoy your stay!\n'), mtime: now }
                ];

                for (const f of initialFiles) {
                    if (f.content) f.size = f.content.length;
                    else f.size = 0;
                    if (!this.entries.has(f.path)) {
                        console.log(`Seeding: ${f.path}`);
                        this.entries.set(f.path, f);
                        this.persistEntry(f);
                    }
                }
            }

            getEntrySync(path) {
                // Normalize path
                if (path === "." || path === "" || path === "./") path = "/";
                if (!path.startsWith("/")) path = "/" + path;
                path = path.replace(/\/+/g, '/');
                if (path.length > 1 && path.endsWith('/')) {
                    path = path.substring(0, path.length - 1);
                }
                return this.entries.get(path);
            }

            putEntrySync(entry) {
                entry.mtime = Date.now();
                this.entries.set(entry.path, entry);
                this.persistEntry(entry);
            }

            persistEntry(entry) {
                const tx = this.db.transaction('files', 'readwrite');
                const store = tx.objectStore('files');
                store.put(entry);
            }

            readdirSync(dirPath) {
                if (dirPath.length > 1 && dirPath.endsWith('/')) {
                    dirPath = dirPath.substring(0, dirPath.length - 1);
                }
                const prefix = dirPath === '/' ? '/' : dirPath + '/';
                const results = [];

                for (const [path, entry] of this.entries.entries()) {
                    if (path === dirPath) continue;
                    if (path.startsWith(prefix)) {
                        const relative = path.substring(prefix.length);
                        if (relative.length > 0 && !relative.includes('/')) {
                            results.push(entry);
                        }
                    }
                }
                
                return results.sort((a, b) => {
                    const na = a.path.split('/').pop() || '';
                    const nb = b.path.split('/').pop() || '';
                    return na.localeCompare(nb);
                });
            }
        }

        // --- WASM Host Implementation ---
        async function initTerminalAndWasm() {
            console.log("initTerminalAndWasm START");
            const term = new Terminal({
                cursorBlink: true,
                allowProposedApi: true,
                fontFamily: 'Consolas, "Cascadia Mono", "Fira Code", Menlo, monospace'
            });
            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            window.term = term;

            term.open(document.getElementById('terminal-container'));
            fitAddon.fit();
            window.addEventListener('resize', () => {
                fitAddon.fit();
                if (window.hostState && window.hostState.triggerSignal) {
                    window.hostState.triggerSignal(28); // SIGWINCH
                }
            });

            term.write('Connecting to kabibi-go WASM...\r\n');

            // Refactored host state
            const fs = new IndexedDBFS();
            await fs.init();
            await fs.seed();

            const hostState = {
                memory: null,
                cwd: "/home/user",
                stdinBuffer: [],
                pendingReads: [],
                pendingSignals: [],
                pendingSignalCounts: new Map(),
                handles: new Map([
                    [0n, { type: 'stdin' }],
                    [1n, { type: 'stdout' }],
                    [2n, { type: 'stderr' }]
                ]),
                nextHandle: 3n,

                safeWriteOverlapped: function(ovPtr, errorCode, continued, resultExt) {
                    if (!this.memory || !this.memory.buffer) return;
                    ovPtr = Number(ovPtr);
                    const buf = this.memory.buffer;
                    if (!Number.isFinite(ovPtr) || ovPtr < 0 || ovPtr + 24 > buf.byteLength) {
                        return;
                    }
                    const view = new DataView(buf);
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, Number(errorCode) || 0, true);
                    view.setBigUint64(ovPtr + 8, BigInt(continued || 0n), true);
                    view.setBigUint64(ovPtr + 16, BigInt(resultExt || 0n), true);
                },
                
                write: function(ovPtr, handle, ptr, len) {
                    const view = new DataView(this.memory.buffer);
                    ptr = Number(ptr);
                    len = Number(len);
                    ovPtr = Number(ovPtr);
                    handle = BigInt(handle);
                    
                    const h = this.handles.get(handle);
                    if (h && (h.type === 'stdout' || h.type === 'stderr' || h.type === 'tty')) {
                        if (len > 0) {
                            const bytes = new Uint8Array(this.memory.buffer, ptr, len).slice();
                            if (bytes.length > 0) {
                                term.write(bytes);
                            }
                        }
                    } else if (h && h.type === 'file') {
                        const buf = new Uint8Array(this.memory.buffer, ptr, len);
                        const newContent = new Uint8Array(h.entry.content.length + len);
                        newContent.set(h.entry.content);
                        newContent.set(buf, h.entry.content.length);
                        h.entry.content = newContent;
                        fs.putEntrySync(h.entry);
                    }
                    
                    // Write overlapped result
                    view.setUint32(ovPtr, 1, true); // done
                    view.setUint32(ovPtr + 4, 0, true); // errorCode = 0
                    view.setBigUint64(ovPtr + 8, 0n, true); // continued
                    view.setBigUint64(ovPtr + 16, BigInt(len), true); // resultExt = nwritten
                    return 0;
                },
                read: function(ovPtr, handle, ptr, len) {
                    ovPtr = Number(ovPtr);
                    ptr = Number(ptr);
                    len = Number(len);
                    handle = BigInt(handle);
                    
                    const h = this.handles.get(handle);
                    if (h && (h.type === 'stdin' || h.type === 'tty')) {
                        if (this.stdinBuffer.length > 0) {
                            const toRead = Math.min(len, this.stdinBuffer.length);
                            const data = this.stdinBuffer.splice(0, toRead);
                            const buf = new Uint8Array(this.memory.buffer, ptr, toRead);
                            buf.set(data);

                            const view = new DataView(this.memory.buffer);
                            view.setUint32(ovPtr, 1, true); // done
                            view.setUint32(ovPtr + 4, 0, true); // errorCode = 0
                            view.setBigUint64(ovPtr + 8, 0n, true); // continued
                            view.setBigUint64(ovPtr + 16, BigInt(toRead), true); // resultExt = nread
                            return 0;
                        }
                        this.pendingReads.push({ ovPtr, ptr, len });
                        return 0;
                    } else if (h && h.type === 'file') {
                        const available = h.entry.content.length - h.offset;
                        const toRead = Math.min(len, available);
                        if (toRead > 0) {
                            const buf = new Uint8Array(this.memory.buffer, ptr, toRead);
                            buf.set(h.entry.content.subarray(h.offset, h.offset + toRead));
                            h.offset += toRead;
                        }
                        const view = new DataView(this.memory.buffer);
                        view.setUint32(ovPtr, 1, true); // done
                        view.setUint32(ovPtr + 4, 0, true); // errorCode = 0
                        view.setBigUint64(ovPtr + 8, 0n, true); // continued
                        view.setBigUint64(ovPtr + 16, BigInt(toRead), true); // resultExt = nread
                        return 0;
                    }
                    return 0;
                },
                pushStdin: function(data) {
                    if (typeof data === 'string') {
                        const encoded = encoder.encode(data);
                        this.stdinBuffer.push(...encoded);
                        console.log(`pushStdin: string "${data}" (${encoded.length} bytes), pendingReads=${this.pendingReads.length}`);
                    } else {
                        this.stdinBuffer.push(...data);
                        console.log(`pushStdin: ${data.length} bytes, pendingReads=${this.pendingReads.length}`);
                    }
                    this.processPendingReads();
                },
                processPendingReads: function() {
                    if (!this.memory) return;
                    const view = new DataView(this.memory.buffer);
                    let completedCount = 0;
                    while (this.pendingReads.length > 0 && this.stdinBuffer.length > 0) {
                        const { ovPtr, ptr, len } = this.pendingReads.shift();
                        const toRead = Math.min(len, this.stdinBuffer.length);
                        const data = this.stdinBuffer.splice(0, toRead);
                        const buf = new Uint8Array(this.memory.buffer, ptr, toRead);
                        buf.set(data);

                        view.setUint32(ovPtr, 1, true); // done
                        view.setUint32(ovPtr + 4, 0, true); // errorCode = 0
                        view.setBigUint64(ovPtr + 8, 0n, true); // continued
                        view.setBigUint64(ovPtr + 16, BigInt(toRead), true); // resultExt = nread
                        completedCount++;
                    }
                    if (completedCount > 0) {
                        console.log(`processPendingReads: completed ${completedCount} reads`);
                    }
                },
                triggerSignal: function(signum) {
                    if (!this.memory) return;
                    const remaining = [];
                    let completed = 0;
                    for (const s of this.pendingSignals) {
                        if (s.signum === signum || s.signum === 0) {
                            this.safeWriteOverlapped(s.ovPtr, 0, 0n, BigInt(signum));
                            completed++;
                        } else {
                            remaining.push(s);
                        }
                    }
                    if (completed > 0) {
                        console.log(`triggerSignal(${signum}): completed ${completed} waits`);
                    } else {
                        const current = this.pendingSignalCounts.get(signum) || 0;
                        this.pendingSignalCounts.set(signum, current + 1);
                    }
                    this.pendingSignals = remaining;
                    return completed;
                },
                completeSignalWait: function(ovPtr, signum) {
                    this.safeWriteOverlapped(ovPtr, 0, 0n, BigInt(signum));
                }
            };
            window.hostState = hostState;

            const resolvePath = (inputPath) => {
                const raw = String(inputPath || '').replace(/\0.*/, '');
                let path = raw;
                if (!path) {
                    path = hostState.cwd;
                } else if (!path.startsWith('/')) {
                    path = hostState.cwd === '/' ? `/${path}` : `${hostState.cwd}/${path}`;
                }
                path = path.replace(/\/+/g, '/');
                const parts = [];
                for (const seg of path.split('/')) {
                    if (!seg || seg === '.') continue;
                    if (seg === '..') {
                        if (parts.length > 0) parts.pop();
                        continue;
                    }
                    parts.push(seg);
                }
                return '/' + parts.join('/');
            };

            const parentDir = (path) => {
                if (!path || path === '/') return '/';
                const idx = path.lastIndexOf('/');
                if (idx <= 0) return '/';
                return path.slice(0, idx);
            };

            term.onData(data => hostState.pushStdin(data));

            // Define the "env" module expected by rusticated/washmhost guest binaries
            const env = {
                get_args: (ptr, len) => {
                    const args = ["kabibi-go"];
                    let totalLen = 0;
                    const encoded = args.map(a => {
                        const e = encoder.encode(a + "\0");
                        totalLen += e.length;
                        return e;
                    });
                    
                    if (ptr !== 0 && len >= totalLen) {
                        let offset = Number(ptr);
                        for (const e of encoded) {
                            const buf = new Uint8Array(hostState.memory.buffer, offset, e.length);
                            buf.set(e);
                            offset += e.length;
                        }
                    }
                    return (BigInt(args.length) << 32n) | BigInt(totalLen);
                },
                get_env: (ptr, len) => {
                    const envVars = ["TERM=xterm-256color", "COLORTERM=truecolor", "PATH=/bin", "HOME=/home/user"];
                    let totalLen = 0;
                    const encoded = envVars.map(v => {
                        const e = encoder.encode(v + "\0");
                        totalLen += e.length;
                        return e;
                    });
                    
                    if (ptr !== 0 && len >= totalLen) {
                        let offset = Number(ptr);
                        for (const e of encoded) {
                            const buf = new Uint8Array(hostState.memory.buffer, offset, e.length);
                            buf.set(e);
                            offset += e.length;
                        }
                    }
                    return (BigInt(envVars.length) << 32n) | BigInt(totalLen);
                },
                get_cwd: (buf_ptr, buf_len) => {
                    const cwd = hostState.cwd;
                    const enc = encoder.encode(cwd + "\0");
                    if (buf_ptr !== 0) {
                        const buf = new Uint8Array(hostState.memory.buffer, buf_ptr, Math.min(enc.length, buf_len));
                        buf.set(enc.slice(0, Math.min(enc.length, buf_len)));
                    }
                    return BigInt(enc.length);
                },
                set_cwd: (ptr, len) => {
                    const pathBytes = new Uint8Array(hostState.memory.buffer, Number(ptr), Number(len));
                    const normalized = resolvePath(decoder.decode(pathBytes));
                    const entry = fs.getEntrySync(normalized);
                    if (entry && entry.type === 'dir') {
                        hostState.cwd = normalized;
                        return 0;
                    }
                    return 2; // ENOENT
                },
                get_random: (ptr, len) => {
                    const buf = new Uint8Array(hostState.memory.buffer, Number(ptr), Number(len));
                    crypto.getRandomValues(buf);
                },
                get_time: () => BigInt(Date.now()) * 1000000n,
                host_panic: (ptr, len) => {
                    const buf = new Uint8Array(hostState.memory.buffer, Number(ptr), Number(len));
                    const msg = decoder.decode(buf);
                    console.error("HOST PANIC:", msg);
                    term.write(`\r\n\x1b[31mHOST PANIC: ${msg}\x1b[0m\r\n`);
                    throw new Error("WASM Panicked");
                },
                timer_set: (ovPtr, delayMs) => {
                    ovPtr = Number(ovPtr);
                    setTimeout(() => {
                        hostState.safeWriteOverlapped(ovPtr, 0, 0n, 0n);
                    }, Number(delayMs));
                },
                read: (ovPtr, handle, ptr, len) => hostState.read(ovPtr, handle, ptr, len),
                seek: (ovPtr, handle, offset, whence) => {
                    ovPtr = Number(ovPtr);
                    offset = Number(offset);
                    whence = Number(whence);
                    const view = new DataView(hostState.memory.buffer);
                    const h = hostState.handles.get(BigInt(handle));

                    if (!h) {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 9, true); // EBADF
                        return 0;
                    }

                    let base = 0;
                    if (h.type === 'file' && h.entry && typeof h.entry.content !== 'undefined') {
                        base = h.entry.content.length;
                    }

                    let nextPos = 0;
                    switch (whence) {
                        case 0: // SEEK_SET
                            nextPos = offset;
                            break;
                        case 1: // SEEK_CUR
                            nextPos = (Number(h.offset || 0)) + offset;
                            break;
                        case 2: // SEEK_END
                            nextPos = base + offset;
                            break;
                        default:
                            view.setUint32(ovPtr, 1, true);
                            view.setUint32(ovPtr + 4, 22, true); // EINVAL
                            return 0;
                    }

                    if (nextPos < 0) {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 22, true); // EINVAL
                        return 0;
                    }

                    h.offset = nextPos;
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    view.setBigUint64(ovPtr + 8, 0n, true);
                    view.setBigUint64(ovPtr + 16, BigInt(nextPos), true);
                    return 0;
                },
                write: (ovPtr, handle, ptr, len) => hostState.write(ovPtr, handle, ptr, len),
                handle_close: (handle) => {
                    hostState.handles.delete(BigInt(handle));
                },
                path_open: (ovPtr, pathPtr, pathLen, flags) => {
                    const rawPath = decoder.decode(new Uint8Array(hostState.memory.buffer, Number(pathPtr), Number(pathLen))).replace(/\0.*/, '');
                    let path = resolvePath(rawPath);
                    console.log("PATH_OPEN:", path, flags);
                    ovPtr = Number(ovPtr);
                    const view = new DataView(hostState.memory.buffer);
                    const oflags = Number(flags);

                    // Two flag families are used by guests:
                    // 1) rusticated-rust wasm fs::OpenOptions: read=1, write=2, create=4, trunc=8, append=16, create_new=32
                    // 2) rusticated-go/wasip1 style: access mode in low 2 bits, create=0x40, excl=0x80, trunc=0x200, append=0x400
                    const hasHighPosixBits = (oflags & (0x40 | 0x80 | 0x200 | 0x400)) !== 0;
                    const hasOnlyRusticatedBits = (oflags & ~0x1003f) === 0;
                    const useRusticatedFlags = !hasHighPosixBits && hasOnlyRusticatedBits;

                    let readFlag = false;
                    let writeFlag = false;
                    let createFlag = false;
                    let createNewFlag = false;
                    let truncateFlag = false;
                    let appendFlag = false;

                    if (useRusticatedFlags) {
                        readFlag = (oflags & 1) !== 0;
                        writeFlag = (oflags & 2) !== 0;
                        createFlag = (oflags & 4) !== 0;
                        truncateFlag = (oflags & 8) !== 0;
                        appendFlag = (oflags & 16) !== 0;
                        createNewFlag = (oflags & 32) !== 0;
                    } else {
                        const accessMode = oflags & 3;
                        readFlag = accessMode === 0 || accessMode === 2;
                        writeFlag = accessMode === 1 || accessMode === 2;
                        createFlag = (oflags & 0x40) !== 0;
                        createNewFlag = (oflags & 0x80) !== 0;
                        truncateFlag = (oflags & 0x200) !== 0;
                        appendFlag = (oflags & 0x400) !== 0;
                    }

                    const wantDirectory = (oflags & 0x10000) !== 0;

                    let entry = fs.getEntrySync(path);
                    
                    if (rawPath === "/dev/tty" || rawPath === "CONIN$" || rawPath === "CONOUT$") {
                        const handle = hostState.nextHandle++;
                        hostState.handles.set(handle, { type: 'tty', entry: { path: '/dev/tty', type: 'file' }, offset: 0 });
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 0, true);
                        view.setBigUint64(ovPtr + 16, handle, true);
                        return 0;
                    }

                    if (!entry) {
                        if (createFlag || createNewFlag) {
                            const parent = parentDir(path);
                            const p = fs.getEntrySync(parent);
                            if (!p || p.type !== 'dir') {
                                view.setUint32(ovPtr, 1, true);
                                view.setUint32(ovPtr + 4, 44, true); // ENOENT
                                return 0;
                            }
                            entry = {
                                path,
                                type: 'file',
                                content: new Uint8Array(0),
                                size: 0,
                                mtime: Date.now(),
                                mode: 0o100644
                            };
                            fs.entries.set(path, entry);
                            fs.putEntrySync(entry);
                        } else {
                            view.setUint32(ovPtr, 1, true);
                            view.setUint32(ovPtr + 4, 44, true); // ENOENT
                            return 0;
                        }
                    } else if (createNewFlag) {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 17, true); // EEXIST
                        return 0;
                    }

                    if (wantDirectory && entry.type !== 'dir') {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 54, true); // ENOTDIR
                        return 0;
                    }

                    if (entry.type === 'file' && truncateFlag) {
                        entry.content = new Uint8Array(0);
                        entry.size = 0;
                        entry.mtime = Date.now();
                        fs.putEntrySync(entry);
                    }
                    
                    const handle = hostState.nextHandle++;
                    hostState.handles.set(handle, { 
                        type: entry.type === 'dir' ? 'dir' : 'file', 
                        entry, 
                        offset: appendFlag && entry.type === 'file' ? (entry.content ? entry.content.length : 0) : 0,
                        dirOffset: 0,
                        dirEntries: null,
                        dirLeftovers: []
                    });
                    
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    view.setBigUint64(ovPtr + 16, handle, true);
                    return 0;
                },
                dir_read: (ovPtr, handle, bufPtr, bufLen) => {
                    handle = BigInt(handle);
                    ovPtr = Number(ovPtr);
                    bufPtr = Number(bufPtr);
                    bufLen = Number(bufLen);
                    console.log("DIR_READ:", { handle, bufLen, dirOffset: hostState.handles.get(handle)?.dirOffset });
                    const view = new DataView(hostState.memory.buffer);
                    const h = hostState.handles.get(handle);

                    if (!h || h.type !== 'dir') {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 20, true); // ENOTDIR
                        return 0;
                    }

                    if (!Array.isArray(h.dirEntries)) {
                        h.dirEntries = fs.readdirSync(h.entry.path);
                        h.dirOffset = 0;
                        h.dirLeftovers = [];
                    }

                    let currentOffset = bufPtr;
                    let bytesWritten = 0;
                    let remaining = bufLen;
                    let loopCount = 0;
                    const maxLoops = 1000; // Prevent infinite loops

                    while (remaining > 0 && loopCount < maxLoops) {
                        loopCount++;
                        
                        if (h.dirLeftovers.length > 0) {
                            const toCopy = Math.min(remaining, h.dirLeftovers.length);
                            const out = new Uint8Array(hostState.memory.buffer, currentOffset, toCopy);
                            out.set(h.dirLeftovers.slice(0, toCopy));
                            h.dirLeftovers = h.dirLeftovers.slice(toCopy);
                            currentOffset += toCopy;
                            bytesWritten += toCopy;
                            remaining -= toCopy;
                            if (h.dirLeftovers.length > 0) {
                                break;
                            }
                            continue;
                        }

                        if (h.dirOffset >= h.dirEntries.length) {
                            break;
                        }

                        const e = h.dirEntries[h.dirOffset];
                        h.dirOffset++;
                        const name = e.isVirtualDotDot ? '..' : (e.path.split('/').pop() || '.');
                        if (name === '.' || name === '..') {
                            continue;
                        }
                        const nameEnc = encoder.encode(name);
                        const entryBytes = new Uint8Array(1 + nameEnc.length + 1);
                        entryBytes[0] = e.type === 'dir' ? 2 : 1; // 1: File, 2: Dir
                        entryBytes.set(nameEnc, 1);
                        entryBytes[1 + nameEnc.length] = 0;

                        if (entryBytes.length <= remaining) {
                            const out = new Uint8Array(hostState.memory.buffer, currentOffset, entryBytes.length);
                            out.set(entryBytes);
                            currentOffset += entryBytes.length;
                            bytesWritten += entryBytes.length;
                            remaining -= entryBytes.length;
                            continue;
                        }

                        h.dirLeftovers = Array.from(entryBytes);
                    }

                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    view.setBigUint64(ovPtr + 16, BigInt(bytesWritten), true);
                    return 0;
                },
                path_stat: (ovPtr, pathPtr, pathLen, flags, outPtr, outLen) => {
                    const path = resolvePath(decoder.decode(new Uint8Array(hostState.memory.buffer, Number(pathPtr), Number(pathLen))));
                    ovPtr = Number(ovPtr);
                    outPtr = Number(outPtr);
                    const view = new DataView(hostState.memory.buffer);

                    const entry = fs.getEntrySync(path);
                    if (!entry) {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 44, true); // ENOENT
                        return 0;
                    }
                    
                    // AbiStat (64 bytes): kind (u32), mode (u32), uid (u32), gid (u32), size (u64), mtime (u64), atime (u64), ctime (u64), nlink (u64), inode (u64)
                    const statView = new DataView(hostState.memory.buffer, outPtr, 64);
                    statView.setUint32(0, entry.type === 'dir' ? 2 : 1, true); // 1: File, 2: Dir
                    statView.setUint32(4, entry.type === 'dir' ? 0o40755 : 0o100644, true); 
                    statView.setUint32(8, 1000, true); 
                    statView.setUint32(12, 1000, true); 
                    statView.setBigUint64(16, BigInt(entry.content ? entry.content.length : 0), true);
                    statView.setBigUint64(24, BigInt(entry.mtime || Date.now()) * 1000000n, true); 
                    statView.setBigUint64(32, BigInt(entry.mtime || Date.now()) * 1000000n, true); 
                    statView.setBigUint64(40, BigInt(entry.mtime || Date.now()) * 1000000n, true); 
                    statView.setBigUint64(48, 1n, true); 
                    statView.setBigUint64(56, 1n, true); 

                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    view.setBigUint64(ovPtr + 16, 64n, true);
                    return 0;
                },
                path_chmod: (ovPtr, pathPtr, pathLen, mode) => {
                    const path = resolvePath(decoder.decode(new Uint8Array(hostState.memory.buffer, Number(pathPtr), Number(pathLen))));
                    const entry = fs.getEntrySync(path);
                    const view = new DataView(hostState.memory.buffer);
                    ovPtr = Number(ovPtr);
                    if (!entry) {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 44, true); // ENOENT
                        return 0;
                    }
                    entry.mode = Number(mode) || entry.mode || 0o100644;
                    fs.putEntrySync(entry);
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    return 0;
                },
                path_remove: (ovPtr, pathPtr, pathLen) => {
                    const path = resolvePath(decoder.decode(new Uint8Array(hostState.memory.buffer, Number(pathPtr), Number(pathLen))));
                    const view = new DataView(hostState.memory.buffer);
                    ovPtr = Number(ovPtr);
                    const entry = fs.getEntrySync(path);
                    if (!entry) {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 44, true);
                        return 0;
                    }
                    fs.entries.delete(path);
                    try {
                        const tx = fs.db.transaction('files', 'readwrite');
                        tx.objectStore('files').delete(path);
                    } catch (e) {
                        console.warn('Failed deleting fs entry:', path, e);
                    }
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    return 0;
                },
                path_mkdir: (ovPtr, pathPtr, pathLen, mode) => {
                    const path = resolvePath(decoder.decode(new Uint8Array(hostState.memory.buffer, Number(pathPtr), Number(pathLen))));
                    const view = new DataView(hostState.memory.buffer);
                    ovPtr = Number(ovPtr);
                    if (fs.getEntrySync(path)) {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 17, true); // EEXIST
                        return 0;
                    }
                    const entry = { path, type: 'dir', mtime: Date.now(), mode: Number(mode) || 0o40755 };
                    fs.entries.set(path, entry);
                    fs.putEntrySync(entry);
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    return 0;
                },
                path_rename: (ovPtr, oldPtr, oldLen, newPtr, newLen) => {
                    const oldPath = resolvePath(decoder.decode(new Uint8Array(hostState.memory.buffer, Number(oldPtr), Number(oldLen))));
                    const newPath = resolvePath(decoder.decode(new Uint8Array(hostState.memory.buffer, Number(newPtr), Number(newLen))));
                    const view = new DataView(hostState.memory.buffer);
                    ovPtr = Number(ovPtr);
                    const entry = fs.getEntrySync(oldPath);
                    if (!entry) {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 44, true); // ENOENT
                        return 0;
                    }
                    fs.entries.delete(oldPath);
                    entry.path = newPath;
                    fs.entries.set(newPath, entry);
                    fs.putEntrySync(entry);
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    return 0;
                },
                net_open: (...args) => 0,
                net_accept: (...args) => 0,
                net_lookup: (ovPtr, namePtr, nameLen, bufPtr, bufLen) => {
                    const view = new DataView(hostState.memory.buffer);
                    ovPtr = Number(ovPtr);
                    const totalSize = 8;
                    if (Number(bufLen) >= totalSize) {
                        view.setUint32(Number(bufPtr), totalSize, true);
                        view.setUint32(Number(bufPtr) + 4, 0, true);
                    }
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    view.setBigUint64(ovPtr + 16, BigInt(totalSize), true);
                    return 0;
                },
                net_cert_verify: (ovPtr, namePtr, nameLen, chainPtr, chainLen) => {
                    const view = new DataView(hostState.memory.buffer);
                    ovPtr = Number(ovPtr);
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    view.setBigUint64(ovPtr + 16, 1n, true);
                    return 0;
                },
                process_spawn: (ovPtr, cfgPtr, cfgLen) => {
                    const view = new DataView(hostState.memory.buffer);
                    ovPtr = Number(ovPtr);
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 38, true); // ENOSYS
                    return 0;
                },
                process_pipe: (ovPtr) => {
                    const view = new DataView(hostState.memory.buffer);
                    ovPtr = Number(ovPtr);
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    view.setBigUint64(ovPtr + 16, 0n, true);
                    return 0;
                },
                process_wait: (ovPtr, handle) => {
                    const view = new DataView(hostState.memory.buffer);
                    ovPtr = Number(ovPtr);
                    const h = hostState.handles.get(BigInt(handle));
                    if (!h) {
                        view.setUint32(ovPtr, 1, true);
                        view.setUint32(ovPtr + 4, 9, true); // EBADF
                        return 0;
                    }
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 0, true);
                    view.setBigUint64(ovPtr + 16, 0n, true);
                    return 0;
                },
                process_signal: (...args) => 0,
                signal_wait: (ovPtr, signum) => {
                    ovPtr = Number(ovPtr);
                    signum = Number(signum);
                    if (!Number.isFinite(ovPtr) || !Number.isFinite(signum)) {
                        return 0;
                    }
                    if (!Array.isArray(hostState.pendingSignals)) {
                        hostState.pendingSignals = [];
                    }

                    // Keep the queue bounded: if guests spam waits, evict oldest
                    // entries and complete them with cancellation.
                    if (hostState.pendingSignals.length > 2048) {
                        const dropped = hostState.pendingSignals.shift();
                        if (dropped) {
                            hostState.safeWriteOverlapped(dropped.ovPtr, 11, 0n, 0n); // ECANCELED
                        }
                    }

                    const queued = hostState.pendingSignalCounts.get(signum) || 0;
                    if (queued > 0) {
                        hostState.pendingSignalCounts.set(signum, queued - 1);
                        hostState.safeWriteOverlapped(ovPtr, 0, 0n, BigInt(signum));
                        return 0;
                    }

                    hostState.pendingSignals.push({ ovPtr, signum });

                    // Complete on the next macrotask so the browser gets a chance
                    // to render/input between guest polling iterations.
                    setTimeout(() => {
                        hostState.triggerSignal(signum);
                    }, 0);
                    return 0;
                },
                dylib_open: (ovPtr, pathPtr, pathLen, flags) => {
                    const view = new DataView(hostState.memory.buffer);
                    view.setUint32(ovPtr, 1, true); // done
                    view.setUint32(ovPtr + 4, 38, true); // ENOSYS (predictable fail)
                    return 0;
                },
                dylib_sym: (ovPtr, libHandle, namePtr, nameLen) => {
                    const view = new DataView(hostState.memory.buffer);
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 38, true); // ENOSYS
                    return 0;
                },
                dylib_call: (ovPtr, symHandle, descPtr, descLen) => {
                    const view = new DataView(hostState.memory.buffer);
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 38, true); // ENOSYS
                    return 0;
                },
                dylib_callback_create: (ovPtr, libHandle, sigPtr, sigLen, namePtr, nameLen) => {
                    const view = new DataView(hostState.memory.buffer);
                    view.setUint32(ovPtr, 1, true);
                    view.setUint32(ovPtr + 4, 38, true); // ENOSYS
                    return 0;
                },
                dylib_callback_respond: (cbHandle, invocationId, retValue) => {
                },
                dylib_callback_wait: (ovPtr, outPtr, outLen) => {
                    // No native DLL in the browser host: report the wait as
                    // cancelled so a guest pump (if ever entered) exits cleanly.
                    const view = new DataView(hostState.memory.buffer);
                    view.setUint32(ovPtr, 1, true);     // done
                    view.setUint32(ovPtr + 4, 11, true); // ECANCELED -> ok=false
                    return 0;
                },
                dylib_callback_stop: () => {},
                dylib_close: (libHandle) => {
                },
                dylib_read_cstr: (hostPtr, guestBufPtr, maxLen) => {
                    return 0;
                },
                dylib_read_mem: (hostPtr, guestBufPtr, maxLen) => {
                    return 0;
                },
                cancel: (...args) => {},
                get_platform_info: (outPtr, outLen) => {
                    const view = new DataView(hostState.memory.buffer);
                    outPtr = Number(outPtr);
                    const structSize = 548;
                    if (Number(outLen) < structSize) return 7; // E2BIG

                    const buf = new ArrayBuffer(structSize);
                    const dv = new DataView(buf);
                    dv.setUint32(0, 1, true);
                    dv.setUint8(4, 47);
                    dv.setUint8(5, 58);
                    dv.setUint16(6, 2, true);
                    dv.setUint16(16, 1, true);
                    dv.setUint8(18, 64);

                    const copyAscii = (dstOff, str) => {
                        const bytes = encoder.encode(str.slice(0, 63));
                        new Uint8Array(buf, dstOff, bytes.length).set(bytes);
                    };

                    copyAscii(20, 'browser');
                    copyAscii(84, 'rusticated-wasm');
                    copyAscii(156, 'wasm32');
                    copyAscii(220, 'rusticated');
                    copyAscii(284, '0.0.0-dev');
                    copyAscii(356, '0.0.0-dev');
                    copyAscii(420, new Date().toISOString().slice(0, 19));
                    copyAscii(484, 'browser-wasm32');

                    new Uint8Array(hostState.memory.buffer, outPtr, structSize).set(new Uint8Array(buf));
                    return 0;
                },
                tty_set_mode: (handle, mode) => {
                    console.log("TTY SET MODE:", { handle, mode, typeHandle: typeof handle, typeMode: typeof mode });
                },
                tty_get_size: (handle) => {
                    const size = (term.cols << 16) | term.rows;
                    console.log("TTY GET SIZE:", { handle, size, cols: term.cols, rows: term.rows });
                    return size;
                },
                fd_isatty: (handle) => {
                    console.log("FD_ISATTY:", handle);
                    handle = BigInt(handle);
                    if (handle >= 0n && handle <= 2n) return 1;
                    const h = hostState.handles.get(handle);
                    return (h && (h.type === 'tty' || h.type === 'stdin' || h.type === 'stdout' || h.type === 'stderr')) ? 1 : 0;
                },
                process_exit: (code) => {
                    code = Number(code);
                    console.log("Process exited with code", code);
                    if (code !== 0) {
                        term.write(`\r\n[Process exited with code ${code}]\r\n`);
                    }
                },
                rusticated_debug: (val) => console.log("GUEST DEBUG:", val),
            };

            const wasi = {
                fd_write: (fd, iovs, iovs_len, nwritten) => {
                    const view = new DataView(hostState.memory.buffer);
                    let total = 0;
                    for (let i = 0; i < iovs_len; i++) {
                        const ptr = view.getUint32(iovs + Number(i) * 8, true);
                        const len = view.getUint32(iovs + Number(i) * 8 + 4, true);
                        const bytes = new Uint8Array(hostState.memory.buffer, ptr, len).slice();
                        const text = termDecoder.decode(bytes, { stream: true });
                        if (text.length > 0) {
                            term.write(text);
                        }
                        total += len;
                    }
                    view.setUint32(nwritten, total, true);
                    return 0;
                },
                fd_read: (fd, iovs, iovs_len, nread) => 0,
                path_open: (...args) => 0,
                proc_exit: (code) => env.process_exit(code),
                environ_sizes_get: (c, b) => {
                    const view = new DataView(hostState.memory.buffer);
                    view.setUint32(c, 0, true);
                    view.setUint32(b, 0, true);
                    return 0;
                },
                environ_get: (e, eb) => 0,
                args_sizes_get: (c, b) => {
                    const view = new DataView(hostState.memory.buffer);
                    view.setUint32(c, 0, true);
                    view.setUint32(b, 0, true);
                    return 0;
                },
                args_get: (a, ab) => 0,
                clock_time_get: (i, p, t) => 0,
                fd_close: () => 0,
                fd_fdstat_get: () => 0,
                fd_seek: () => 0,
            };

            const importObject = {
                env,
                wasi_snapshot_preview1: wasi
            };

            try {
                console.log("Fetching WASM from ./try/kabibi-go.wasm");
                const response = await fetch('./try/kabibi-go.wasm');
                console.log("Fetch response:", response.status);
                if (!response.ok) throw new Error(`HTTP ${response.status} fetching WASM`);
                const binary = await response.arrayBuffer();
                console.log("Binary size:", binary.byteLength);
                const { instance } = await WebAssembly.instantiate(binary, importObject);
                console.log("WASM instantiated.");
                window.lastInstance = instance;
                hostState.memory = instance.exports.memory;
                // Bubble Tea and the rusticated runtime usually wait for the first
                // SIGWINCH before drawing; without a synthetic initial resize the
                // TUI can sit forever in the browser host.
                hostState.triggerSignal(28);
                
                console.log("WASM Exports:", Object.keys(instance.exports));
                term.write('WASM loaded. Starting kabibi-go...\r\n\r\n');
                
                const runFunc = instance.exports.run || instance.exports._start;
                if (runFunc) {
                    const runLoop = () => {
                        try {
                            const res = runFunc();
                            const r = Number(res);
                            if (r === 0) {
                                term.write('\r\n[Process Finished]\r\n');
                                return;
                            }
                            // 1ms instead of 0ms for active yielding to prevent event loop starvation
                            setTimeout(runLoop, (r === 2 || r === 4) ? 1 : 10);
                        } catch (e) {
                            console.error("Runtime error:", e);
                            term.write(`\r\n\x1b[31mRuntime Error: ${e.message}\x1b[0m\r\n`);
                        }
                    };
                    runLoop();
                } else {
                    term.write('Error: No entry point found in WASM.\r\n');
                }
            } catch (err) {
                console.error(err);
                term.write(`\r\nFailed to load kabibi-go: ${err.message}\r\n`);
            }
        }

        window.onload = () => {
            const contentDiv = document.getElementById('content');
            
            try {
                if (typeof __README__ === 'function') {
                    const funcStr = __README__.toString();
                    const startIdx = funcStr.indexOf('/*') + 2;
                    const endIdx = funcStr.lastIndexOf('*/');
                    
                    if (startIdx !== -1 && endIdx !== -1) {
                        let rawMarkdown = funcStr.substring(startIdx, endIdx);
                        rawMarkdown = rawMarkdown.replace(/^\s*-->\s*/, '').replace(/\s*<!--\s*$/, '');
                        contentDiv.innerHTML = marked.parse(rawMarkdown);
                    } else {
                        throw new Error("Could not find polyglot comment boundaries.");
                    }
                } else {
                    throw new Error("__README__ function not found in README.md script payload.");
                }
            } catch (err) {
                console.error(err);
                contentDiv.innerHTML = `<p id="error-msg">Failed to load README.md.<br><small>${err.message}</small></p>`;
            }

            document.getElementById('main-body').style.opacity = 1;

            // Initialize Terminal and WASM
            initTerminalAndWasm();
        };
    </script>
</body>
